    { g: 'Tisch', id: 'sclad', label: 'Seitenverkleidung OSB', def: 12, unit: 'mm', help: '0 = ohne', show: isJig('saw') },
    { g: 'Tisch', id: 'skb', label: 'Kantholz Breite', def: 58, unit: 'mm', show: isJig('saw') },
    { g: 'Tisch', id: 'skt', label: 'Kantholz Stärke', def: 38, unit: 'mm', show: isJig('saw') },
    { g: 'Skala & Anschlag', id: 'sScale', label: 'Maßband + Langloch auf', type: 'select', def: 'both', options: [['both', 'beiden Flügeln'], ['left', 'nur links'], ['right', 'nur rechts'], ['none', 'keinem Flügel']], show: isJig('saw') },
    { g: 'Skala & Anschlag', id: 'sSlot', label: 'Langloch als', type: 'select', def: 'holz', options: [['holz', 'Holz-Langloch 8,5 mm (Oberfräse)'], ['tnut', 'Alu-T-Nutschiene 19 mm eingelassen']], show: v => v.jig === 'saw' && v.sScale !== 'none' },
    { g: 'Skala & Anschlag', id: 'sKerf', label: 'Schnittbreite Sägeblatt', def: 2.4, unit: 'mm', help: 'steht auf dem Sägeblatt', show: v => v.jig === 'saw' && v.sScale !== 'none' },
    { g: 'Lehrenaufnahme', id: 'Lmax', label: 'Längste Lehre / Werkstück', def: 1500, unit: 'mm', show: isJig('saw') },
    { g: 'Lehrenaufnahme', id: 'gW', label: 'Lehre Stärke', def: 30, unit: 'mm', help: 'Dachlatte 50 × 30 hochkant = 30', show: isJig('saw') },
    { g: 'Lehrenaufnahme', id: 'gH', label: 'Lehre Höhe', def: 50, unit: 'mm', show: isJig('saw') },
  ],
  compute(v) {
    const msgs = [], plan = { title: JIGS.find(j => j[0] === v.jig)[1], msgs };
    if (v.jig === 'rail' || v.jig === 'tsq') {
      const len = v.jig === 'rail' ? v.L : v.Lt;
      if (v.a >= v.sole) msgs.push(['err', 'Abstand Sägeblatt ↔ Sohlenkante muss kleiner als die Sohlenbreite sein.']);
      const over = 25;
      const bw = v.f + v.a + over;
      const scr = STD_SCREW_LEN.filter(l => l <= v.bt + v.ft - 2).pop() || 12;
      const nScrew = Math.ceil((len - 50) / 150) + 1;
      const parts = [
        { name: 'Grundplatte', qty: 1, l: len, b: bw, t: v.bt, mat: 'MDF/HDF oder Sperrholz', note: `wird mit der Säge auf ${mm(v.f + v.a)} besäumt` },
        { name: 'Anschlagleiste', qty: 1, l: len, b: v.f, t: v.ft, mat: 'Multiplex', note: 'Fabrikkante = Anschlagkante, muss absolut gerade sein' },
      ];
      if (v.jig === 'tsq') parts.push({ name: 'Querleiste (T-Anschlag)', qty: 1, l: v.Lq, b: 60, t: 18, mat: 'Multiplex', note: 'wird unter die Grundplatte geschraubt, exakt 90°' });
      plan.parts = parts;
      plan.kpis = [['Grundplatte (roh)', `${num(len)} × ${num(bw)}`], ['Nach Besäumen', mm(v.f + v.a)], ['Schrauben', `${nScrew} × 3,5×${scr}`]];
      const fs = len / 30;
      const sc = Math.min(1, 600 / len);
      let g = S.rect(0, 0, len, bw, 'class="wood"');
      g += S.rect(0, bw - (bw - v.f - v.a), len, bw - v.f - v.a, 'fill="#f5d6d6" stroke="#8a1c1c" stroke-dasharray="6 4"');
      g += S.rect(0, 0, len, v.f, 'class="wood2"');
      for (let i = 0; i < nScrew; i++) g += S.circle(25 + i * (len - 50) / Math.max(1, nScrew - 1), v.f / 2, Math.max(3, v.f / 12), 'class="hole"');
      const qy = Math.min(0, (bw - v.Lq) / 2);
      if (v.jig === 'tsq') { g += S.rect(0, (bw - v.Lq) / 2, 60, v.Lq, 'class="ghost"'); g += S.text(64, (bw - v.Lq) / 2 + fs * 0.8, 'Querleiste (unten)', `font-size="${fs * 0.6}" class="lbl"`); }
      g += S.text(len / 2, v.f / 2 + fs * 0.3, 'Anschlagleiste', `font-size="${fs * 0.8}" text-anchor="middle"`);
      g += S.text(len / 2, v.f + v.a / 2 + fs * 0.3, 'hier läuft die Sohle', `font-size="${fs * 0.8}" text-anchor="middle" class="lbl"`);
      g += S.text(len / 2, bw - (bw - v.f - v.a) / 2 + fs * 0.3, 'wird abgesägt → Kante = Schnittlinie', `font-size="${fs * 0.7}" text-anchor="middle" fill="#8a1c1c"`);
      g += dimV(0, v.f, len + fs * 0.9, num(v.f), fs * 0.8) + dimV(v.f, v.f + v.a, len + fs * 0.9, num(v.a), fs * 0.8);
      g += dimH(0, len, -fs * 0.6, num(len), fs);
      plan.drawings = [drawing(-fs * 2.5, qy - fs * 2, len + fs * 4, bw - 2 * qy + fs * 3, g, 'Draufsicht – rot gestrichelt wird beim ersten Schnitt abgesägt')];
      plan.jigs = [['Winkel/Anschlagwinkel', '–', v.jig === 'tsq' ? 'Querleiste exakt 90° zur Anschlagleiste; Kontrolle 3-4-5: 300 / 400 / 500 mm' : 'Anschlagleiste parallel zur Plattenkante ausrichten']];
      plan.buy = [
        [`MDF/Sperrholz ${v.bt} mm`, '1 Streifen', `${num(len)} × ${num(bw)} mm`],
        [`Multiplex ${v.ft} mm`, '1 Streifen', `${num(len)} × ${num(v.f)} mm – Fabrikkante verwenden`],
        [`Spax Senkkopf 3,5 × ${scr}`, `${nScrew + (v.jig === 'tsq' ? 4 : 0)} Stk`, 'von unten, versenkt'],
        ['Holzleim', '–', ''],
        ['Antirutsch-Band oder Schleifpapier-Streifen', 'optional', 'unter die Grundplatte'],
        ['2 Schraubzwingen', '–', 'zum Fixieren beim Sägen'],
      ];
      plan.steps = [
        `<b>Abstand messen:</b> Säge auf 0° und Schnitttiefe max. Lineal an die Sohlenkante (die Seite, die am Anschlag laufen soll) legen und bis zur Zahnspitze messen. Ergebnis ins Feld „Sägeblatt ↔ Sohlenkante“ (aktuell ${mm(v.a)}).`,
        `<b>Zuschneiden:</b> Grundplatte ${mm(len)} × ${mm(bw)} (${mm(over)} Übermaß), Anschlagleiste ${mm(len)} × ${mm(v.f)} mit gerader Fabrikkante.`,
        `<b>Anschlag aufleimen:</b> Anschlagleiste bündig an der hinteren Kante der Grundplatte aufleimen, Fabrikkante zeigt zur Säge. Von unten ${nScrew} Schrauben 3,5 × ${scr} alle 15 cm, gut versenken – Schraubenköpfe dürfen nicht überstehen.`,
        v.jig === 'tsq' ? `<b>Querleiste:</b> Querleiste (${mm(v.Lq)}) am Anfang unter die Grundplatte schrauben, mit dem Winkel exakt 90° zur Anschlagleiste. Erst 1 Schraube, Winkel prüfen (3-4-5-Methode), dann restliche Schrauben.` : `<b>Aushärten lassen:</b> Leim mindestens 1 Stunde trocknen lassen, Zwingen alle 20 cm.`,
        `<b>Besäumen:</b> Schiene auf eine Opferplatte spannen, Säge an der Anschlagleiste entlangführen und das Übermaß abschneiden. Die neue Kante ist ab jetzt <b>exakt die Schnittlinie</b>.`,
        `<b>Benutzen:</b> Kante der Grundplatte auf den Anriss legen, festzwingen, sägen. Nur mit dieser Säge und diesem Sägeblatt verwenden (andere Blattstärke = andere Kante). Schiene beschriften!`,
      ];
      // 1:1-Schablone Kopfstück (erste 170 mm) mit Schraubpositionen
      const tl = Math.min(len, 170);
      let b = S.rect(0, 10, tl, bw, 'fill="none" stroke="#000" stroke-width="0.3"');
      b += S.rect(0, 10, tl, v.f, 'fill="#eee" stroke="#000" stroke-width="0.3"');
      b += S.text(2, 7, 'Kopfstück 1:1 – Unterseite der Grundplatte, Anschlag oben', 'font-size="3"');
      for (let i = 0; i < nScrew; i++) { const x = 25 + i * (len - 50) / Math.max(1, nScrew - 1); if (x <= tl) b += holeMark(x, 10 + v.f / 2, 3.5); }
      b += S.line(0, 10 + v.f + v.a, tl, 10 + v.f + v.a, 'stroke="#c00" stroke-width="0.4" stroke-dasharray="3 1.5"');
      b += S.text(2, 10 + v.f + v.a - 2, `Schnittlinie (${num(v.f + v.a)} ab Hinterkante)`, 'font-size="3" fill="#c00"');
      plan.templates = bw + 20 <= 240 ? [{ title: 'Kopfstück Führungsschiene', w: tl, h: bw + 14, body: b }] : [];
    } else if (v.jig === 'holes32') {
      const n = Math.max(1, Math.floor((v.hl - 2 * v.first) / v.raster) + 1);
      const W = v.edge + 23;
      plan.kpis = [['Löcher', String(n)], ['Raster', mm(v.raster)], ['Bohrtiefe', mm(v.depth)]];
      plan.parts = [
        { name: 'Schablonenleiste', qty: 1, l: v.hl, b: W, t: 18, mat: 'Multiplex', note: 'Löcher mit Ständerbohrmaschine exakt senkrecht' },
        { name: 'Anschlagleiste', qty: 1, l: v.hl, b: 30, t: 18, mat: 'Multiplex', note: 'unten an die Vorderkante, bildet den Anschlag' },
      ];

    } else if (v.jig === 'saw') {

function loadPdfLibs() {

// Standardschrift im PDF kennt nur Westeuropa-Zeichen
const pdfTxt = s => String(s)
  .replace(/→/g, '->').replace(/←/g, '<-').replace(/↓/g, 'v').replace(/↔/g, '<->').replace(/◄/g, '<')
  .replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/[✓✔]/g, '').replace(/✕/g, 'x').replace(/[„“”]/g, '"').replace(/[‚‘’]/g, "'")

// Stile aus dem CSS fest in die SVG schreiben; Linienstärken für den Druck in mm umrechnen
// opt.family: Schrift im PDF · opt.mono: Farben → Schwarz-Weiß (helle Flächen, dunkle Linien)
function prepSvg(svg, targetWmm, opt = {}) {

    const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/.exec(val || '');
    if (!m) return val;
    if (m[4] !== undefined && +m[4] === 0) return 'none';
    const r = +m[1], g = +m[2], b = +m[3];
    if (r > 200 && g > 150 && b < 120 && r - b > 100) return val;            // Gelb (Hervorhebung) bleibt
    const lum = 0.3 * r + 0.59 * g + 0.11 * b;
    if (isStroke) return lum > 215 ? val : 'rgb(20,20,20)';
    if (lum < 90) return 'rgb(28,28,28)';
    const l = Math.round(255 - (255 - lum) * 0.35);
    return `rgb(${l},${l},${l})`;
  };

      let val = d.getAttribute(p) || cs.getPropertyValue(p);
      if (!val) return;
      if (opt.mono && (p === 'fill' || p === 'stroke') && val !== 'none') {
        if (val[0] === '#') { const n = parseInt(val.slice(1).padEnd(6, val.slice(1)), 16); val = `rgb(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255})`; }

    const da = cs.getPropertyValue('stroke-dasharray');

      d.setAttribute('stroke-width', Math.max(0.12, sw * 0.22) * upm);

      d.setAttribute('font-weight', fw >= 600 ? 'bold' : 'normal');
      if (d.tagName === 'text') d.textContent = family === 'helvetica' ? pdfTxt(d.textContent) : d.textContent;

  clone.setAttribute('font-family', family);

}
function registerInter(doc) {

async function deliverPdf(doc, name) {
  name = name.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/ß/g, 'ss').replace(/[^\w.-]+/g, '-').replace(/-+/g, '-');
  const blob = doc.output('blob');
  const file = new File([blob], name, { type: 'application/pdf' });
  let shared = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); shared = true; } catch (e) { if (e && e.name === 'AbortError') shared = true; }

    const a = document.createElement('a');

/* =====================================================================
   Heft-Bauplan für alle übrigen Tools (French Cleat, Schienen & Schablonen)
   Gleicher Stil wie der Regal-Bauplan: Inter, Schwarz-Weiß, je Thema eine Seite
   ===================================================================== */
async function exportHeftPdf(tool, root, btn) {
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Bauplan wird gesetzt …'; }
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:900px;height:900px;overflow:hidden';
  document.body.appendChild(host);

    await loadPdfLibs();
    const plan = tool.compute(values(tool));
    if (plan.fatal) throw new Error('Die Planung hat Fehler – bitte zuerst die roten Hinweise beheben.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const hasInter = registerInter(doc);
    const F = { r: hasInter ? ['Inter', 'normal'] : ['helvetica', 'normal'], b: hasInter ? ['Inter', 'bold'] : ['helvetica', 'bold'], xb: hasInter ? ['InterXB', 'normal'] : ['helvetica', 'bold'] };
    const T = s => hasInter ? String(s) : pdfTxt(s);
    const ML = 16, W = 210 - 32, TOP = 16, BOT = 280;
    const INK = [24, 24, 24], GREY = [120, 120, 120], LINE = [210, 210, 210];
    const date = new Date().toLocaleDateString('de-DE');
    const unit = tool.unit === 'cm' ? 'cm' : 'mm';
    const fmt = x => unit === 'cm' ? (Math.round(x) / 10).toFixed(1).replace('.', ',') : num(x);
    const strip = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); };

    const font = (f, size, col = INK) => { doc.setFont(...F[f]); doc.setFontSize(size); doc.setTextColor(...col); };
    const write = (txt, x, yy, f, size, opt = {}) => { font(f, size, opt.col); doc.text(T(txt), x, yy, opt); };
    const rule = (yy, wdt = 0.5, col = INK) => { doc.setDrawColor(...col); doc.setLineWidth(wdt); doc.line(ML, yy, ML + W, yy); };
    const newPage = title => {
      if (!first) doc.addPage(); first = false;
      pageTitle = title; y = TOP;
      if (title) { write(title, ML, y + 9, 'xb', 25); rule(y + 13); y += 19; }
    };
    const need = h => { if (y + h > BOT) newPage(pageTitle.endsWith('(Forts.)') ? pageTitle : pageTitle + ' (Forts.)'); };
    const para = (txt, f = 'r', size = 9, col = INK, gap = 2, x = ML, w = W) => {
      font(f, size, col);
      const lh = size * 0.3528 * 1.42;
      doc.splitTextToSize(T(txt), w).forEach(l => { need(lh); doc.text(l, x, y + lh * 0.75); y += lh; });
      y += gap;

      const head = () => { need(9); cols.forEach((c, i) => write(c.h, xs[i] + 1, y + 4, 'r', 7, { col: GREY })); y += 5.5; rule(y, 0.45); y += 0.5; };
      head();
      rows.forEach(r => {
        const cells = r.map((c, i) => { font(i === 0 ? 'b' : 'r', i === 0 ? 8.8 : 8.2); return doc.splitTextToSize(T(c == null ? '' : c), cols[i].w * W - 2.5); });
        const rh = Math.max(7, Math.max(...cells.map(c => c.length)) * 3.5 + 3.4);
        if (y + rh > BOT) { newPage(pageTitle.endsWith('(Forts.)') ? pageTitle : pageTitle + ' (Forts.)'); head(); }
        cells.forEach((c, i) => { font(i === 0 ? 'b' : 'r', i === 0 ? 8.8 : 8.2); c.forEach((l, j) => doc.text(l, xs[i] + 1, y + 4.5 + j * 3.5)); });
        y += rh; rule(y, 0.15, LINE);
      });
      y += 4;
    };

      let w = maxW, h = maxW * vb.height / vb.width;

    const figs = [...out.querySelectorAll('figure.drw')];

    const title = plan.title;

    // ===== 1 · Titel =====
    newPage('');
    font('b', 7.5); doc.text(T(`BAUPLAN · ${tool.title.toUpperCase()} · ${date}`), ML, y + 4, { charSpace: 0.9 });
    y += 9;
    font('xb', 38);
    doc.splitTextToSize(T(title.toLowerCase()), W).forEach(l => { doc.text(l, ML - 1, y + 13); y += 14.5; });
    y += 2;
    para(`Selbstbau-Plan · Maße in ${unit}`, 'r', 10.5, INK, 3);
    rule(y, 0.5); y += 6;
    const coverFig = drawFigs.find(f => f.classList.contains('iso')) || drawFigs[0];
    if (coverFig) y += await putSvg(coverFig.querySelector('svg'), ML, y, W, 140, true) + 8;
    // Kennzahlen groß
    const k = (plan.kpis || []).slice(0, 6);
    const cw = W / 3;
    k.forEach((kv, i) => {
      const col = i % 3; if (col === 0 && i) y += 17;
      const x = ML + col * cw;
      font('xb', 15); const lines = doc.splitTextToSize(T(kv[1]), cw - 4);
      write(lines[0], x, y + 7, 'xb', 15);
      write(kv[0], x, y + 12, 'r', 7.5, { col: GREY });
    });
    y += 20;

    // ===== 2 · Material =====
    if ((plan.parts && plan.parts.length) || (plan.buy && plan.buy.length)) {
      newPage('Material');
      if (plan.parts && plan.parts.length) {
        write('Zuschnitt', ML, y + 4, 'xb', 12); y += 8;
        table([{ h: 'Teil', w: 0.34 }, { h: 'Stk', w: 0.07 }, { h: `Länge`, w: 0.1 }, { h: 'Breite', w: 0.1 }, { h: 'Stärke', w: 0.09 }, { h: 'Material / Hinweis', w: 0.3 }],
          plan.parts.map(p => [p.name, String(p.qty), p.l != null ? fmt(p.l) : '–', p.b != null ? fmt(p.b) : '–', p.t != null ? fmt(p.t) : '–', [p.mat, p.note].filter(Boolean).join(' · ')]));
        para(`Alle Maße in ${unit}.`, 'r', 7.5, GREY);
      }
      if (plan.buy && plan.buy.length) { need(20); write('Einkauf', ML, y + 4, 'xb', 12); y += 8; table([{ h: 'Menge', w: 0.18 }, { h: 'Artikel', w: 0.42 }, { h: 'Wofür', w: 0.4 }], plan.buy.map(r => [r[1], r[0], r[2]])); }
      if (plan.jigs && plan.jigs.length) { need(20); write('Lehren & Hilfsmittel', ML, y + 4, 'xb', 12); y += 8; table([{ h: 'Lehre', w: 0.3 }, { h: 'Maß', w: 0.18 }, { h: 'Wofür', w: 0.52 }], plan.jigs.filter(j => j[0] || j[2])); }
    }
    // ===== 3 · Zuschnittplan (falls vorhanden) =====
    if (plan.cutplan && cutFigs.length) {
      newPage('Zuschnitt');
      const d = document.createElement('div'); d.innerHTML = plan.cutplan;
      let fi = 0;
      for (const el of [...d.children]) {
        if (el.tagName === 'P') para(el.textContent, 'r', 9);
        else if (el.tagName === 'FIGURE' && cutFigs[fi]) { const svg = cutFigs[fi++].querySelector('svg'); const vb = svg.viewBox.baseVal; need(Math.min(120, W * vb.height / vb.width) + 4); y += await putSvg(svg, ML, y, W, 120, true) + 4; }
      }
    }
    // ===== 4 · Zeichnungen =====
    if (drawFigs.length) {
      newPage('Zeichnungen');
      for (const f of drawFigs) {
        if (f === coverFig && f.classList.contains('iso')) continue;
        const svg = f.querySelector('svg'), vb = svg.viewBox.baseVal;
        const h = Math.min(150, W * vb.height / vb.width);
        if (y + h + 14 > BOT) newPage('Zeichnungen (Forts.)');
        y += await putSvg(svg, ML, y, W, 150, true) + 2;
        const cap = f.querySelector('figcaption'); if (cap) para(cap.textContent, 'r', 7.8, GREY, 5);
      }
    }
    // ===== 5 · Aufbau =====
    if (plan.steps && plan.steps.length) {
      newPage('Aufbau');
      plan.steps.forEach((st, i) => {
        const d = document.createElement('div'); d.innerHTML = st;
        const b = d.querySelector('b'); const head = b ? b.textContent.replace(/:$/, '') : '';
        if (b) b.remove();
        const body = d.textContent.replace(/^\s*:?\s*/, '').trim();
        font('r', 9); const lines = doc.splitTextToSize(T(body), W - 16);
        need(10 + lines.length * 4.6);
        write(String(i + 1), ML, y + 8, 'xb', 20);
        if (head) write(head, ML + 14, y + 5.5, 'b', 11);
        y += head ? 8 : 2;
        para(body, 'r', 9, INK, 4, ML + 14, W - 14);
        rule(y - 2, 0.15, LINE); y += 2;
      });
    }
    // ===== 6 · Hinweise =====
    if (plan.msgs && plan.msgs.length) {
      newPage('Hinweise & Sicherheit');
      plan.msgs.forEach(m => para((m[0] === 'err' ? 'Fehler: ' : m[0] === 'warn' ? 'Achtung: ' : '') + m[1], m[0] === 'info' ? 'r' : 'b', 9, m[0] === 'err' ? [150, 30, 30] : INK, 2.5));
      y += 4;
      para('Dieser Bauplan ist eine Anleitung für den Eigenbau, erzeugt mit der Bauplan App. Maße, Tragfähigkeit und Sicherheit hängen von Material, Ausführung und Maschine ab und sind vom Nachbauer zu prüfen. Vor dem ersten Einsatz Probeschnitt bzw. Probelauf machen. Keine Haftung für Schäden aus dem Nachbau.', 'r', 7, GREY);
    }
    // ===== 7 · Schablonen 1:1 =====
    for (const tile of out.querySelectorAll('.tpls svg.tile')) {
      doc.addPage();
      await doc.svg(prepSvg(tile, 180, { family: hasInter ? 'Inter' : 'helvetica' }), { x: 15, y: 12, width: 180, height: 255 });
    }
    // Fußzeilen
    const n = doc.getNumberOfPages();

    }

  } catch (e) {

    alert('PDF konnte nicht erstellt werden: ' + (e && e.message ? e.message : e));

      const vb = svg.viewBox.baseVal;
      let w = W, h = W * vb.height / vb.width;
      if (h > maxH) { h = maxH; w = h * vb.width / vb.height; }
      need(h + 4);
      await doc.svg(prepSvg(svg, w, { family: FF }), { x: M + (W - w) / 2, y, width: w, height: h });
      y += h + 2;
    };
    const out = root.querySelector('.out');
    const date = new Date().toLocaleDateString('de-DE');
    for (const el of [...out.children]) {
      const cl = el.classList;
      if (cl.contains('printhead')) { text(el.textContent, 18, 'bold', 1); text(`Bauplan App · erstellt am ${date} · Maße in ${tool.unit === 'cm' ? 'cm' : 'mm'}`, 8.5, 'normal', 4, [107, 114, 128]); continue; }
      if (el.tagName === 'H2') continue;
      if (cl.contains('summary')) { el.querySelectorAll('.kpi').forEach(k => text(`${k.querySelector('span').textContent}: ${k.querySelector('b').textContent}`, 10, 'normal', 0.5)); y += 3; continue; }
      if (cl.contains('msg')) {
        if (cl.contains('noprint')) continue;
        const pre = cl.contains('err') ? 'FEHLER: ' : cl.contains('warn') ? 'Achtung: ' : 'Hinweis: ';
        text(pre + el.textContent, 9, cl.contains('err') ? 'bold' : 'normal', 1.5, cl.contains('err') ? [138, 28, 28] : cl.contains('warn') ? [122, 75, 0] : [23, 58, 94]);
        continue;
      }
      if (el.tagName === 'H3' && /Schablonen/.test(el.textContent)) continue;
      if (el.tagName === 'H3') { need(30); y += 3; text(el.textContent, 13, 'bold', 1, [194, 65, 12]); doc.setDrawColor(194, 65, 12); doc.setLineWidth(0.4); doc.line(M, y - 1, M + W, y - 1); y += 2; continue; }
      if (el.tagName === 'FIGURE') {
        await putSvg(el.querySelector('svg'));
        const cap = el.querySelector('figcaption');
        if (cap) text(cap.textContent, 8, 'italic', 3, [107, 114, 128]);
        continue;
      }
      if (cl.contains('tablewrap')) {
        doc.autoTable({
          html: el.querySelector('table'), startY: y, margin: { left: M, right: M },
          styles: { font: FF, fontSize: 8, cellPadding: 1.2, textColor: [31, 41, 51], lineColor: [217, 211, 199], lineWidth: 0.1 },
          headStyles: { fillColor: [241, 236, 226], textColor: [31, 41, 51], fontStyle: 'bold' },
          didParseCell: d => { d.cell.text = d.cell.text.map(tx); },
        });
        y = doc.lastAutoTable.finalY + 3;
        continue;
      }
      if (el.tagName === 'P') { text(el.textContent, 8.5, 'normal', 2, [80, 80, 80]); continue; }
      if (el.tagName === 'OL') {
        [...el.children].forEach((li, i) => {
          const b = li.querySelector('b');
          text(`${i + 1}. ${li.textContent}`, 9.5, 'normal', 1.8);
          if (b) { /* Fettdruck nicht nötig – Nummer reicht */ }
        });
        continue;
      }
      if (cl.contains('tpls')) {
        for (const tile of el.querySelectorAll('svg.tile')) {
          doc.addPage();
          await doc.svg(prepSvg(tile, 180, { family: FF }), { x: 15, y: 12, width: 180, height: 255 });
        }
        y = PH;
        continue;
      }
    }
    // Seitenzahlen
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont(FF, 'normal'); doc.setFontSize(7.5); doc.setTextColor(140); doc.text(tx(`${tool.title} · Seite ${i}/${n}`), 210 - M, 292, { align: 'right' }); }

    const name = `Bauplan-${tool.title.replace(/[^\wäöüÄÖÜß-]+/g, '-')}-${new Date().toISOString().slice(0, 10)}.pdf`;
    const blob = doc.output('blob');
    const file = new File([blob], name, { type: 'application/pdf' });
    let shared = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); shared = true; } catch (e) { if (e && e.name === 'AbortError') shared = true; }
    }
    if (!shared) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }
    window.__lastPdf = blob;
  } catch (e) {
    console.error(e);
    alert('PDF konnte nicht erstellt werden: ' + (e && e.message ? e.message : e) + '\nAlternative: „Browser-Druck“.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

/* =====================================================================
   App-Rahmen: Formular, Speicherung, Tabs
   ===================================================================== */
const TOOLS = [toolRegal, toolCleat, toolJigs];
const STORE = 'bauplan-app-v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

function values(tool) {
  const st = state[tool.id] || (state[tool.id] = {});
  const v = {};
  tool.fields.forEach(f => {
    let x = st[f.id];
    if (x === undefined) x = f.type === 'modules' ? JSON.parse(JSON.stringify(f.def)) : f.def;
    if (!f.type || f.type === 'number') x = Number(x) || 0;
    v[f.id] = x;
  });
  return v;
}

function buildForm(tool, el) {
  const v = values(tool);
  const groups = {};
  tool.fields.forEach(f => { (groups[f.g] = groups[f.g] || []).push(f); });
  let h = `<h2>${esc(tool.title)}</h2>`;
  for (const [g, fs] of Object.entries(groups)) {
    const vis = fs.filter(f => !f.show || f.show(v));
    if (!vis.length) continue;
    h += `<fieldset><legend>${esc(g)}</legend>`;
    vis.forEach(f => {
      if (f.type === 'modules') {
        h += `<div class="modrow modhead"><span>Typ</span><span>Stk</span><span>Breite</span><span>Höhe</span><span>Tiefe</span><span></span></div>`;
        v[f.id].forEach((m, i) => {
          h += `<div class="modrow" data-i="${i}"><select data-m="type">${Object.entries(MODS).map(([k, d]) => `<option value="${k}"${k === m.type ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</select>` +
            ['qty', 'w', 'h', 'd'].map(k => `<input type="number" inputmode="numeric" data-m="${k}" value="${m[k]}">`).join('') +
            `<button data-del="${i}" title="Entfernen">✕</button></div>`;
        });
        h += `<button class="btn sec small" data-add="1">+ Modul</button>`;
        return;
      }
      h += `<div class="field${f.type === 'text' ? ' wide' : ''}"><label for="${tool.id}-${f.id}">${esc(f.label)}${f.help ? `<small>${esc(f.help)}</small>` : ''}</label><div class="ctl">`;
      if (f.type === 'text') h += `<input id="${tool.id}-${f.id}" type="text" data-f="${f.id}" value="${esc(v[f.id])}" style="width:100%;font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:8px">`;
      else if (f.type === 'select') h += `<select id="${tool.id}-${f.id}" data-f="${f.id}">${f.options.map(o => `<option value="${o[0]}"${String(v[f.id]) === String(o[0]) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
      else h += `<input id="${tool.id}-${f.id}" type="number" inputmode="decimal" step="any" data-f="${f.id}" value="${v[f.id]}"><span class="unit">${esc(f.unit || '')}</span>`;
      h += `</div></div>`;
    });
    h += `</fieldset>`;
    if (tool.extraAfter === g) h += `<div class="extra"></div>`;
  }
  h += `<div class="actions"><button class="btn" data-pdf="1">📄 Bauplan als PDF (drucken / teilen)</button><button class="btn sec" data-print="1">Browser-Druck</button><button class="btn sec" data-reset="1">Standardwerte</button></div>`;
  h += `<p class="note">Eingaben werden auf diesem Gerät gespeichert.</p>`;
  el.innerHTML = h;
}

let timer = null;
function recalc(tool, root) {
  const out = root.querySelector('.out');
  try { out.innerHTML = renderPlan(tool.compute(values(tool))); }
  catch (e) { out.innerHTML = `<div class="msg err">Fehler bei der Berechnung: ${esc(e.message)}</div>`; console.error(e); }
}

function mountTool(tool) {
  const root = document.createElement('section');
  root.className = 'tool';
  root.id = 'tool-' + tool.id;
  root.innerHTML = `<div class="card inputs"></div><div class="card out"></div>`;
  const form = root.querySelector('.inputs');
  const st = () => state[tool.id] || (state[tool.id] = {});
  const refreshExtra = force => {
    if (!tool.extra) return;
    const x = form.querySelector('.extra');
    if (x && (force || !x.contains(document.activeElement))) x.innerHTML = tool.extra(values(tool), st());
  };
  const rebuild = () => { buildForm(tool, form); refreshExtra(true); };
  const recalcAll = () => { recalc(tool, root); refreshExtra(false); };
  rebuild();
  const setField = (id, val) => { st()[id] = val; };
  form.addEventListener('change', e => {
    if (!e.target.closest('.extra') || !tool.onExtra) return;
    tool.onExtra(st(), e.target, 'change'); save(); refreshExtra(true); recalc(tool, root);
  });
  form.addEventListener('input', e => {
    const el = e.target;
    if (el.closest('.extra')) return;
    if (el.dataset.f) {
      const f = tool.fields.find(x => x.id === el.dataset.f);
      const val = f.type === 'select' || f.type === 'text' ? el.value : el.value.replace(',', '.');
      setField(f.id, val);
      if (f.onchange) { f.onchange(val, setField); }
      if (f.type === 'select') { rebuild(); }
    } else if (el.dataset.m) {
      const i = +el.closest('.modrow').dataset.i;
      const mods = values(tool).modules;
      const k = el.dataset.m;
      mods[i][k] = k === 'type' ? el.value : Number(el.value) || 0;
      if (k === 'type') Object.assign(mods[i], MODS[el.value].def);
      st().modules = mods;
      if (k === 'type') rebuild();
    }
    save();
    clearTimeout(timer);
    timer = setTimeout(recalcAll, 150);
  });
  form.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.closest('.extra')) { if (tool.onExtra) { tool.onExtra(st(), b, 'click'); save(); refreshExtra(true); recalc(tool, root); } return; }
    if (b.dataset.pdf) { (tool.printPdf || exportPdf)(tool, root, b); return; }
    if (b.dataset.print) { window.print(); return; }
    if (b.dataset.reset) { if (confirm('Alle Eingaben dieses Tools auf Standard zurücksetzen?')) { state[tool.id] = {}; save(); rebuild(); recalc(tool, root); } return; }
    if (b.dataset.add) { const mods = values(tool).modules; mods.push({ type: 'ablage', qty: 1, ...MODS.ablage.def }); st().modules = mods; }
    if (b.dataset.del != null) { const mods = values(tool).modules; mods.splice(+b.dataset.del, 1); st().modules = mods; }
    save(); rebuild(); recalc(tool, root);
  });
  recalcAll();
  return root;
}

function init() {
  const main = document.getElementById('main'), tabs = document.getElementById('tabs');
  TOOLS.forEach(t => {
    main.appendChild(mountTool(t));
    const b = document.createElement('button');
    b.textContent = t.title; b.dataset.tool = t.id;
    b.onclick = () => activate(t.id);
    tabs.appendChild(b);
  });
  activate(state.active || TOOLS[0].id);
}
function activate(id) {
  state.active = id; save();
  document.querySelectorAll('.tool').forEach(s => s.classList.toggle('active', s.id === 'tool-' + id));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tool === id));
  window.scrollTo(0, 0);
}
init();
</script>
