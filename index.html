<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bauplan">
<meta name="theme-color" content="#1f2933">
<title>Bauplan App</title>
<style>
:root {
  --bg: #f4f1ea;
  --card: #ffffff;
  --ink: #1f2933;
  --muted: #6b7280;
  --line: #d9d3c7;
  --wood: #e8c99b;
  --wood-dark: #b98a4e;
  --accent: #c2410c;
  --accent-soft: #fde7d9;
  --warn-bg: #fff4d6;
  --warn-ink: #7a4b00;
  --err-bg: #fde2e2;
  --err-ink: #8a1c1c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
  padding-bottom: env(safe-area-inset-bottom);
}
header {
  position: sticky; top: 0; z-index: 10;
  background: var(--ink); color: #fff;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 0;
}
header h1 { margin: 0 0 8px; font-size: 19px; letter-spacing: .2px; }
header h1 span { color: #fbbf77; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button {
  flex: 1 0 auto; border: 0; background: transparent; color: #cbd5e1;
  padding: 9px 12px; font-size: 14px; font-weight: 600; border-radius: 10px 10px 0 0; cursor: pointer;
}
nav.tabs button.active { background: var(--bg); color: var(--ink); }
main { max-width: 1100px; margin: 0 auto; padding: 14px; }
.tool { display: none; }
.tool.active { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.tool.active > * { min-width: 0; }
@media (min-width: 900px) {
  .tool.active { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
  .inputs { position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow: auto; }
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.inputs h2, .out h2 { margin: 0 0 10px; font-size: 17px; }
.out h3 { margin: 22px 0 8px; font-size: 16px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
fieldset { border: 0; padding: 0; margin: 0 0 12px; }
legend { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); margin-bottom: 6px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 120px; align-items: center; gap: 8px; margin-bottom: 7px; }
.field label { font-size: 14px; }
.field small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.field .ctl { display: flex; align-items: center; gap: 4px; }
.field input[type=number], .field select {
  width: 100%; font-size: 16px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fffdf8;
}
.field select { grid-column: auto; }
.field.wide { grid-template-columns: 1fr; }
.field .unit { color: var(--muted); font-size: 12px; min-width: 22px; }
button.btn {
  border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px;
  padding: 11px 14px; border-radius: 10px; cursor: pointer; width: 100%;
}
button.btn.sec { background: #e5e0d4; color: var(--ink); }
button.small { padding: 6px 9px; font-size: 13px; width: auto; }
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kpi { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
.kpi b { display: block; font-size: 18px; }
.kpi span { font-size: 12px; color: var(--muted); }
.msg { border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
.msg.warn { background: var(--warn-bg); color: var(--warn-ink); }
.msg.err { background: var(--err-bg); color: var(--err-ink); font-weight: 600; }
.msg.info { background: #e6f0fa; color: #173a5e; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #f1ece2; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
ol.steps { padding-left: 22px; margin: 0; }
ol.steps li { margin-bottom: 8px; }
figure.drw { margin: 10px 0; }
figure.drw svg { width: 100%; height: auto; max-height: 70vh; background: #fffdf8; border: 1px solid var(--line); border-radius: 10px; }
figure.drw figcaption { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.drw svg * { vector-effect: non-scaling-stroke; }
.drw .wood { fill: var(--wood); stroke: #6b4a1f; stroke-width: 1; }
.drw .wood2 { fill: var(--wood-dark); stroke: #4a3213; stroke-width: 1; }
.drw .box { fill: #eef3f7; stroke: #5b6b7a; stroke-width: 1; }
.drw .boxrim { fill: #d4dee8; stroke: #5b6b7a; stroke-width: 1; }
.drw .ghost { fill: none; stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 3; }
.drw .wall { fill: #ddd6c9; stroke: none; }
.drw .dim line { stroke: var(--accent); stroke-width: 1; }
.drw .dim text { fill: var(--accent); font-weight: 600; }
.drw text { font-family: system-ui, sans-serif; fill: var(--ink); }
.drw .lbl { fill: #374151; }
.drw .hole { fill: #fff; stroke: #111; stroke-width: 1; }
.drw .mod { fill: #f6e3c4; stroke: #6b4a1f; stroke-width: 1; }
.drw .modbad { fill: #fbd0d0; stroke: #8a1c1c; stroke-width: 1; }
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tpl { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.tpl svg.tile { width: 100%; height: auto; display: block; }
.tpl p { margin: 4px 2px 0; font-size: 12px; color: var(--muted); }
.modrow { display: grid; grid-template-columns: minmax(0, 1fr) 40px 54px 54px 54px 28px; gap: 4px; align-items: center; margin-bottom: 5px; }
.modrow input, .modrow select { width: 100%; min-width: 0; font-size: 15px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 7px; background: #fffdf8; }
.modhead { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.modrow button { border: 0; background: #eee5d6; border-radius: 7px; padding: 6px 0; cursor: pointer; }
.printhead { display: none; }
.rowed { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 10px; background: #fcfaf5; }
.rowed h4 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.rowed .stat { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.rowed .stat.over { color: var(--err-ink); font-weight: 700; }
.fr { display: grid; grid-template-columns: 18px minmax(0, 1fr) 62px 48px 28px; gap: 4px; align-items: center; margin-bottom: 4px; }
.fr span.nr { font-size: 12px; color: var(--muted); }
.fr select, .fr input { width: 100%; min-width: 0; font-size: 15px; padding: 5px 3px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
.fr input:disabled { background: #eee; color: #888; }
.fr button, .rowed h4 button, .rowed .addrow button { border: 0; background: #eee5d6; border-radius: 7px; padding: 5px 8px; cursor: pointer; font-size: 13px; }
.rowed .addrow { display: flex; gap: 6px; margin-top: 4px; }
.frh { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
.note { font-size: 12.5px; color: var(--muted); }
.actions { display: grid; gap: 8px; margin-top: 10px; }

@media print {
  @page { size: A4; margin: 10mm; }
  body { background: #fff; font-size: 11pt; }
  header, .inputs, .noprint { display: none !important; }
  main { padding: 0; max-width: none; }
  .tool.active { display: block; }
  .card { border: 0; padding: 0; }
  .printhead { display: block; font-size: 20pt; font-weight: 800; margin-bottom: 4mm; }
  .out h3 { break-after: avoid; }
  table, figure.drw, .kpi, ol.steps li { break-inside: avoid; }
  figure.drw svg { max-height: 240mm; border: 0; }
  .tpls { display: block; }
  .tpl { break-before: page; border: 0; padding: 0; }
  .tpl svg.tile { width: 180mm !important; height: 255mm !important; }
  .tpl p { display: none; }
  .kpi { border: 1px solid #ccc; }
}
</style>
</head>
<body>
<header>
  <h1>Bauplan <span>App</span></h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>

<script>
'use strict';
/* =====================================================================
   Bauplan App
   Ein Tool = { id, title, fields[], compute(values) -> plan }
   plan = { title, kpis[], msgs[], drawings[], parts[], buy[], jigs[],
            steps[], templates[], extraHtml }
   Alle Maße in Millimeter.
   ===================================================================== */

/* ---------- Hilfsfunktionen ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const r05 = x => Math.round(x * 2) / 2;
const num = x => { const r = r05(x); return (Number.isInteger(r) ? String(r) : r.toFixed(1)).replace('.', ','); };
const mm = x => num(x) + ' mm';
globalThis.numMm = num;
const cm2m = x => (Math.round(x / 10) / 100).toFixed(2).replace('.', ',') + ' m';
const sum = a => a.reduce((s, x) => s + x, 0);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const STD_SCREW_LEN = [12, 16, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80];

/* ---------- SVG-Bausteine ---------- */
const S = {
  rect: (x, y, w, h, a = '') => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" ${a}/>`,
  line: (x1, y1, x2, y2, a = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${a}/>`,
  poly: (pts, a = '') => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" ${a}/>`,
  pline: (pts, a = '') => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" ${a}/>`,
  circle: (x, y, r, a = '') => `<circle cx="${x}" cy="${y}" r="${r}" ${a}/>`,
  text: (x, y, t, a = '') => `<text x="${x}" y="${y}" ${a}>${esc(t)}</text>`,
};
// Maßkette horizontal (y = Höhe der Maßlinie)
function dimH(x1, x2, y, label, fs) {
  const t = fs * 0.5;
  return `<g class="dim">${S.line(x1, y, x2, y)}${S.line(x1 - t, y + t, x1 + t, y - t)}${S.line(x2 - t, y + t, x2 + t, y - t)}` +
    S.text((x1 + x2) / 2, y - fs * 0.35, label, `font-size="${fs}" text-anchor="middle"`) + `</g>`;
}
// Maßkette vertikal (x = Lage der Maßlinie)
function dimV(y1, y2, x, label, fs) {
  const t = fs * 0.5, cy = (y1 + y2) / 2;
  return `<g class="dim">${S.line(x, y1, x, y2)}${S.line(x - t, y1 + t, x + t, y1 - t)}${S.line(x - t, y2 + t, x + t, y2 - t)}` +
    `<text x="${x - fs * 0.35}" y="${cy}" font-size="${fs}" text-anchor="middle" transform="rotate(-90 ${x - fs * 0.35} ${cy})">${esc(label)}</text></g>`;
}
function drawing(vx, vy, vw, vh, inner, caption) {
  return `<figure class="drw"><svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>` +
    (caption ? `<figcaption>${esc(caption)}</figcaption>` : '') + `</figure>`;
}

/* ---------- 1:1-Schablonen (auf A4 gekachelt) ---------- */
// Eine Schablone: { title, w, h, body (SVG in mm, Ursprung 0/0), hint }
let clipSeq = 0;
const TILE_W = 180, TILE_H = 240, FOOT = 15;
function holeMark(x, y, d) {
  const r = d / 2, c = Math.max(4, d * 0.8);
  return S.circle(x, y, r, 'fill="none" stroke="#000" stroke-width="0.3"') +
    S.line(x - c, y, x + c, y, 'stroke="#000" stroke-width="0.2"') + S.line(x, y - c, x, y + c, 'stroke="#000" stroke-width="0.2"');
}
function tileFooter(title, sub) {
  const fy = TILE_H + 4;
  let svg = S.text(0, fy + 1, title + (sub ? ' – ' + sub : ''), 'font-size="3.2" font-family="sans-serif" fill="#000"');
  svg += S.text(0, fy + 8, 'Drucken mit 100 % / „Tatsächliche Größe“. Kontrollmaß rechts muss genau 100 mm sein →', 'font-size="2.6" font-family="sans-serif" fill="#444"');
  const bx = TILE_W - 100, by = fy + 7;
  svg += S.line(bx, by, bx + 100, by, 'stroke="#000" stroke-width="0.4"');
  for (let i = 0; i <= 10; i++) svg += S.line(bx + i * 10, by - (i % 5 ? 1.5 : 3), bx + i * 10, by, 'stroke="#000" stroke-width="0.3"');
  svg += S.text(bx + 50, by - 3.6, '100 mm', 'font-size="2.6" text-anchor="middle" font-family="sans-serif"');
  return svg;
}
const tileOpen = () => `<svg class="tile" xmlns="http://www.w3.org/2000/svg" width="${TILE_W}mm" height="${TILE_H + FOOT}mm" viewBox="0 0 ${TILE_W} ${TILE_H + FOOT}"><rect x="0" y="0" width="${TILE_W}" height="${TILE_H + FOOT}" fill="#fff"/>`;
// Lange, schmale Schablonen: in Abschnitte teilen, um 90° drehen und nebeneinander auf eine Seite setzen
function renderStrips(t) {
  const segLen = TILE_H - 4, colW = t.h + 8;
  const nSeg = Math.ceil(t.w / segLen), perPage = Math.max(1, Math.floor(TILE_W / colW));
  const pages = Math.ceil(nSeg / perPage);
  let out = '';
  for (let pg = 0; pg < pages; pg++) {
    let svg = tileOpen();
    for (let j = 0; j < perPage; j++) {
      const k = pg * perPage + j;
      if (k >= nSeg) break;
      const x0 = k * segLen, id = 'clp' + (++clipSeq), cx = j * colW;
      // (x,y) -> (cx + t.h - y, x - x0 + 2): Länge läuft nach unten
      svg += `<g transform="matrix(0 1 -1 0 ${cx + t.h} ${2 - x0})"><defs><clipPath id="${id}"><rect x="${x0}" y="-5" width="${segLen}" height="${t.h + 10}"/></clipPath></defs><g clip-path="url(#${id})" font-family="sans-serif">${t.body}</g></g>`;
      svg += S.line(cx, 2, cx + t.h, 2, 'stroke="#c00" stroke-width="0.25" stroke-dasharray="1.5 1"');
      svg += S.line(cx, 2 + segLen, cx + t.h, 2 + segLen, 'stroke="#c00" stroke-width="0.25" stroke-dasharray="1.5 1"');
      svg += S.text(cx + 1, 2 + segLen + 3.5, `Abschnitt ${k + 1}/${nSeg}${k < nSeg - 1 ? ' → unten an ' + (k + 2) + ' stoßen' : ' (Ende)'}`, 'font-size="2.4" font-family="sans-serif" fill="#c00"');
    }
    svg += tileFooter(t.title, `Blatt ${pg + 1}/${pages}, ${nSeg} Abschnitte an den roten Linien zuschneiden und der Reihe nach stoßen`) + '</svg>';
    out += `<div class="tpl">${svg}<p>${esc(t.title)} – Blatt ${pg + 1}/${pages}${t.hint && pg === 0 ? ' · ' + esc(t.hint) : ''}</p></div>`;
  }
  return out;
}
function renderTemplate(t) {
  if (t.w > TILE_W && t.h + 8 <= TILE_W) return renderStrips(t);
  const cols = Math.max(1, Math.ceil(t.w / TILE_W)), rows = Math.max(1, Math.ceil(t.h / TILE_H));
  const total = cols * rows;
  let out = '', k = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    k++;
    const x0 = c * TILE_W, y0 = r * TILE_H, id = 'clp' + (++clipSeq);
    const multi = total > 1;
    let svg = `<svg class="tile" xmlns="http://www.w3.org/2000/svg" width="${TILE_W}mm" height="${TILE_H + FOOT}mm" viewBox="0 0 ${TILE_W} ${TILE_H + FOOT}">`;
    svg += `<defs><clipPath id="${id}"><rect x="${x0}" y="${y0}" width="${TILE_W}" height="${TILE_H}"/></clipPath></defs>`;
    svg += `<rect x="0" y="0" width="${TILE_W}" height="${TILE_H + FOOT}" fill="#fff"/>`;
    svg += `<g transform="translate(${-x0} ${-y0})" clip-path="url(#${id})" font-family="sans-serif">${t.body}</g>`;
    if (multi) {
      svg += `<rect x="0.2" y="0.2" width="${TILE_W - 0.4}" height="${TILE_H - 0.4}" fill="none" stroke="#999" stroke-width="0.25" stroke-dasharray="3 2"/>`;
      if (c < cols - 1) svg += S.text(TILE_W - 2, TILE_H / 2, `→ Teil ${k + 1}`, 'font-size="4" text-anchor="end" fill="#888"');
      if (r < rows - 1) svg += S.text(TILE_W / 2, TILE_H - 2, `↓ Teil ${k + cols}`, 'font-size="4" text-anchor="middle" fill="#888"');
    }
    svg += tileFooter(t.title, multi ? `Teil ${k}/${total} (Zeile ${r + 1}, Spalte ${c + 1}) an gestrichelter Linie stoßen` : '');
    svg += `</svg>`;
    out += `<div class="tpl">${svg}<p>${esc(t.title)}${multi ? ` – Teil ${k}/${total}` : ''}${t.hint && k === 1 ? ' · ' + esc(t.hint) : ''}</p></div>`;
  }
  return out;
}

/* ---------- Zuschnitt-Optimierung (First Fit Decreasing) ---------- */
function packLengths(items, binLen, kerf) {
  const sorted = items.slice().sort((a, b) => b.len - a.len);
  const bins = [];
  for (const it of sorted) {
    if (it.len > binLen) { bins.push({ used: it.len, items: [it], over: true }); continue; }
    let bin = bins.find(b => !b.over && b.used + it.len <= binLen);
    if (!bin) { bin = { used: 0, items: [] }; bins.push(bin); }
    bin.items.push(it);
    bin.used += it.len + kerf;
  }
  return bins;
}
function stripPlanSvg(bins, binLen, stripW, perSheet, caption, opts = {}) {
  if (opts.group) {
    const map = new Map();
    bins.forEach(b => { const k = b.items.map(i => i.label + i.len).join('|'); if (map.has(k)) map.get(k).n++; else map.set(k, { ...b, n: 1 }); });
    bins = [...map.values()];
  }
  const fs = Math.max(18, binLen / 45), gap = Math.max(stripW * 0.25, fs * 1.4);
  const H = bins.length * (stripW + gap) + fs * 1.5;
  let g = '';
  bins.forEach((b, i) => {
    const y = i * (stripW + gap) + fs * 1.2;
    const sheetNo = Math.floor(i / perSheet) + 1;
    g += S.text(0, y - 4, opts.group ? `${b.n}× ${opts.name}` : `Streifen ${i + 1} (Platte ${sheetNo})`, `font-size="${fs * 0.75}" class="lbl"`);
    g += S.rect(0, y, binLen, stripW, 'fill="#f3efe6" stroke="#999" stroke-dasharray="6 4"');
    let x = 0;
    for (const it of b.items) {
      g += S.rect(x, y, it.len, stripW, 'class="wood"');
      g += S.text(x + it.len / 2, y + stripW / 2 + fs * 0.35, `${it.label} ${num(it.len)}`, `font-size="${fs * 0.8}" text-anchor="middle"`);
      x += it.len + 4;
    }
  });
  return drawing(-10, 0, binLen + 20, H, g, caption);
}

/* ---------- Generische Ausgabe ---------- */
function partsTable(parts, unit) {
  if (!parts.length) return '';
  const num = unit === 'cm' ? (x => (Math.round(x) / 10).toFixed(1).replace('.', ',')) : globalThis.numMm;
  let h = '<div class="tablewrap"><table><tr><th>Pos</th><th>Teil</th><th class="n">Stk</th><th class="n">Länge</th><th class="n">Breite</th><th class="n">Stärke</th><th>Material / Hinweis</th></tr>';
  parts.forEach((p, i) => {
    h += `<tr><td>${i + 1}</td><td>${esc(p.name)}</td><td class="n">${p.qty}</td><td class="n">${p.l != null ? num(p.l) : '–'}</td>` +
      `<td class="n">${p.b != null ? num(p.b) : '–'}</td><td class="n">${p.t != null ? num(p.t) : '–'}</td><td>${esc(p.mat || '')}${p.note ? '<br><small>' + esc(p.note) + '</small>' : ''}</td></tr>`;
  });
  return h + `</table></div><p class="note">Alle Maße in ${unit === 'cm' ? 'cm' : 'mm'}. Länge = Faserrichtung bzw. lange Seite.</p>`;
}
function listTable(rows, head) {
  if (!rows.length) return '';
  let h = `<div class="tablewrap"><table><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr>`;
  rows.forEach(r => { h += '<tr>' + r.map((c, i) => `<td${i === 1 ? ' class="n"' : ''}>${esc(c)}</td>`).join('') + '</tr>'; });
  return h + '</table></div>';
}
function renderPlan(plan) {
  let h = `<div class="printhead">${esc(plan.title)}</div>`;
  h += `<h2 class="noprint">${esc(plan.title)}</h2>`;
  if (plan.kpis && plan.kpis.length) h += '<div class="summary">' + plan.kpis.map(k => `<div class="kpi"><b>${esc(k[1])}</b><span>${esc(k[0])}</span></div>`).join('') + '</div>';
  (plan.msgs || []).forEach(m => { h += `<div class="msg ${m[0]}">${esc(m[1])}</div>`; });
  if (plan.fatal) return h;
  if (plan.drawings && plan.drawings.length) h += '<h3>Zeichnungen</h3>' + plan.drawings.join('');
  if (plan.afterDrawings) h += plan.afterDrawings;
  if (plan.parts && plan.parts.length) h += '<h3>Zuschnittliste</h3>' + partsTable(plan.parts, plan.unit);
  if (plan.cutplan) h += '<h3>Zuschnittplan</h3>' + plan.cutplan;
  if (plan.jigs && plan.jigs.length) h += '<h3>Lehren &amp; Hilfsmittel (selbst bauen)</h3>' + listTable(plan.jigs, ['Lehre', 'Maß', 'Wofür']);
  if (plan.buy && plan.buy.length) h += '<h3>Einkaufsliste</h3>' + listTable(plan.buy, ['Artikel', 'Menge', 'Hinweis']);
  if (plan.steps && plan.steps.length) h += '<h3>Bauanleitung</h3><ol class="steps">' + plan.steps.map(s => `<li>${s}</li>`).join('') + '</ol>';
  if (plan.extraHtml) h += plan.extraHtml;
  if (plan.templates && plan.templates.length) {
    h += '<h3>Schablonen 1:1 zum Ausdrucken</h3><div class="msg info noprint">Beim Drucken „Tatsächliche Größe / 100 %“ wählen, nicht „An Seite anpassen“. Auf jedem Blatt ist ein 100-mm-Kontrollmaß (= 10 cm) – vor dem Bohren nachmessen! Mehrteilige Schablonen an der gestrichelten Linie zuschneiden und stumpf aneinanderkleben.</div>';
    h += '<div class="tpls">' + plan.templates.map(renderTemplate).join('') + '</div>';
  }
  return h;
}

/* ---------- 3D-Ansicht (isometrisch, als SVG – druckt auch ins PDF) ---------- */
// Quader: { x0,x1,y0,y1,z0,z1, c: Art }  (x entlang Rückwand, y in den Raum, z nach oben)
const ISO_VIEWS = { vr: 0, vl: -90, hl: 180, hr: 90 };
const ISO_PAL = {
  color: { wood: '#c99a5c', rail: '#4a4a4a', b65: '#b9cde6', b45: '#cfdcec', b22: '#dde6f1', osb: '#e7cf9f', sch: '#f3f1ec', door: '#fbfbf8', hi: '#f2c94c', wall: '#e2ddd2', metal: '#8a8a8a', floor: '#ece6da', edge: null },
  mono: { wood: '#ffffff', rail: '#1c1c1c', b65: '#3c3c3c', b45: '#4c4c4c', b22: '#5c5c5c', osb: '#f3f3f3', sch: '#f7f7f7', door: '#ffffff', hi: '#f2c94c', wall: '#eeeeee', metal: '#777777', floor: null, edge: '#111111' },
};
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = k => clamp(Math.round(((n >> k) & 255) * f), 0, 255);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
// opts: pal ('color'|'mono'), lines [[x,y,z,x,y,z,farbe,breite]], noFloor, raw (nur <svg>), sw (Linienbreite)
function iso3dSvg(cubes, room, view, caption, opts = {}) {
  const pal = ISO_PAL[opts.pal || 'color'];
  const ang = (ISO_VIEWS[view] || 0) * Math.PI / 180, co = Math.round(Math.cos(ang)), si = Math.round(Math.sin(ang));
  const cx = room.w / 2, cy = room.d / 2;
  const rot = (x, y) => [co * (x - cx) - si * (y - cy), si * (x - cx) + co * (y - cy)];
  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  const P = (x, y, z) => [(x - y) * C30, (x + y) * S30 - z];
  const MAXL = 160, parts = [];
  cubes.forEach(c => {
    const [ax, ay] = rot(c.x0, c.y0), [bx, by] = rot(c.x1, c.y1);
    const X0 = Math.min(ax, bx), X1 = Math.max(ax, bx), Y0 = Math.min(ay, by), Y1 = Math.max(ay, by);
    const nx = Math.max(1, Math.ceil((X1 - X0) / MAXL)), ny = Math.max(1, Math.ceil((Y1 - Y0) / MAXL));
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) parts.push({
      x0: X0 + (X1 - X0) * i / nx, x1: X0 + (X1 - X0) * (i + 1) / nx,
      y0: Y0 + (Y1 - Y0) * j / ny, y1: Y0 + (Y1 - Y0) * (j + 1) / ny, z0: c.z0, z1: c.z1, c: c.c,
      bx0: i === 0, bx1: i === nx - 1, by0: j === 0, by1: j === ny - 1,
    });
  });
  parts.sort((a, b) => (a.x0 + a.x1 + a.y0 + a.y1) - (b.x0 + b.x1 + b.y0 + b.y1) || a.z0 - b.z0);
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const pp = (x, y, z) => { const [px, py] = P(x, y, z); minX = Math.min(minX, px); maxX = Math.max(maxX, px); minY = Math.min(minY, py); maxY = Math.max(maxY, py); return [px, py]; };
  const pts = arr => arr.map(a => pp(...a).map(n => n.toFixed(1)).join(',')).join(' ');
  const sw = opts.sw || Math.max(room.w, room.d, 600) / 700;
  const E = pal.edge;
  const seg = (a, b) => { const [x1, y1] = pp(...a), [x2, y2] = pp(...b); return `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  let g = '';
  if (!opts.noFloor && pal.floor) {
    const fl = [[0, 0], [room.w, 0], [room.w, room.d], [0, room.d]].map(([x, y]) => rot(x, y));
    g += `<polygon points="${pts(fl.map(([x, y]) => [x, y, 0]))}" fill="${pal.floor}" stroke="#b9b0a0"/>`;
  }
  parts.forEach(p => {
    const { x0, x1, y0, y1, z0, z1 } = p, col = pal[p.c] || p.c;
    // rechte Seite (x = x1), vordere Seite (y = y1), Deckfläche (z = z1)
    const faces = [
      [[[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], 0.86, [[[x1, y0, z0], [x1, y1, z0]], [[x1, y0, z1], [x1, y1, z1]], ...(p.by0 ? [[[x1, y0, z0], [x1, y0, z1]]] : []), ...(p.by1 ? [[[x1, y1, z0], [x1, y1, z1]]] : [])]],
      [[[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], 0.94, [[[x0, y1, z0], [x1, y1, z0]], [[x0, y1, z1], [x1, y1, z1]], ...(p.bx0 ? [[[x0, y1, z0], [x0, y1, z1]]] : []), ...(p.bx1 ? [[[x1, y1, z0], [x1, y1, z1]]] : [])]],
      [[[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], 1.04, [...(p.by0 ? [[[x0, y0, z1], [x1, y0, z1]]] : []), ...(p.by1 ? [[[x0, y1, z1], [x1, y1, z1]]] : []), ...(p.bx0 ? [[[x0, y0, z1], [x0, y1, z1]]] : []), ...(p.bx1 ? [[[x1, y0, z1], [x1, y1, z1]]] : [])]],
    ];
    faces.forEach(([poly, f, edges]) => {
      g += `<polygon points="${pts(poly)}" fill="${shade(col, f)}"${E ? '' : ''}/>`;
      if (E && edges.length) g += `<path d="${edges.map(e => seg(e[0], e[1])).join('')}" stroke="${E}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
    });
  });
  (opts.lines || []).forEach(l => {
    const [a, b] = [rot(l[0], l[1]), rot(l[3], l[4])];
    g += `<path d="${seg([a[0], a[1], l[2]], [b[0], b[1], l[5]])}" stroke="${l[6] || '#c00'}" stroke-width="${(l[7] || 2) * sw}" fill="none" stroke-linecap="round"/>`;
  });
  const pad = Math.max(maxX - minX, maxY - minY) * 0.03;
  const svg = `<svg viewBox="${(minX - pad).toFixed(0)} ${(minY - pad).toFixed(0)} ${(maxX - minX + 2 * pad).toFixed(0)} ${(maxY - minY + 2 * pad).toFixed(0)}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
  if (opts.raw) return svg;
  return `<figure class="drw iso">${svg}<figcaption>${esc(caption)}</figcaption></figure>`;
}

// Quader eines Moduls (lokale Koordinaten: a entlang, c Tiefe 0 = Wandseite, z Höhe)
// o: frames [[c0,c1],…], rails (false | Anzahl Ebenen im 1. Fach), boxes, plate (Abstandsplatte zeigen), spacers (Abstandshölzer)
function moduleCubes(p, v, gg, H, add, o = {}) {
  const T = v.T, kt = v.kt, k = gg.kb;
  const frames = o.frames || [[0, kt], [T - kt, T]];
  frames.forEach(([c0, c1]) => { add(0, p.len, c0, c1, 0, k, 'wood'); add(0, p.len, c0, c1, H - k, H, 'wood'); });
  let q = 0;
  const post = qq => frames.forEach(([c0, c1]) => add(qq, qq + k, c0, c1, k, H - k, 'wood'));
  post(q);
  p.items.forEach(({ f, w }, fi) => {
    const x0 = q + k;
    const rails = top => { add(x0, x0 + v.lt, 0, T, top - v.lh, top, 'rail'); add(x0 + w - v.lt, x0 + w, 0, T, top - v.lh, top, 'rail'); };
    if (o.spacers) frames.forEach(([c0, c1]) => { add(x0, x0 + w, c0, c1, k, k + 45, 'hi'); add(x0, x0 + w, c0, c1, H - k - 45, H - k, 'hi'); });
    const limit = o.rails === false ? 0 : typeof o.rails === 'number' ? (fi === 0 ? o.rails : 0) : 99;
    if (f.t === 'samla') samlaLevels(f.s, v, gg).forEach((l, li) => {
      if (li >= limit) return;
      rails(l.top);
      if (o.plate && fi === 0 && li === limit - 1) add(x0 + v.lt, x0 + v.lt + 15, -15, T + 15, l.top, l.top + gg.plates.B, 'hi');
      if (!o.boxes) return;
      const rr = l.box === '65' ? v.r65 : v.r28, bx0 = x0 + w / 2 - 195, bx1 = x0 + w / 2 + 195;
      if (l.box === '22') { add(bx0, bx1, T - 290, T - 10, l.top - rr, l.top + 20, 'b22'); add(bx0, bx1, T - 580, T - 300, l.top - rr, l.top + 20, 'b22'); }
      else add(bx0, bx1, T - 580, T - 10, l.top - rr, l.top + 20, l.box === '65' ? 'b65' : 'b45');
    });
    if ((f.t === 'boeden' || f.t === 'schrank') && limit) boardLevels(f.n, gg, f.t === 'schrank').forEach((top, li) => { if (li >= limit) return; rails(top); add(x0, x0 + w, 5, T - 5, top, top + v.osb, 'osb'); });
    if (f.t === 'schrank' && limit) {
      add(x0 - k, x0 + w + k, -v.osb2, 0, 0, H, 'sch');
      add(x0, x0 + v.osb2, kt, T - kt, k, H - k, 'sch'); add(x0 + w - v.osb2, x0 + w, kt, T - kt, k, H - k, 'sch');
      if (o.boxes) add(x0 - k + 2, x0 + w + k - 2, T, T + 19, 10, H - 10, 'door');
    }
    q = x0 + w; post(q);
  });
}
// Ganze Planung als Quader
function layoutCubes(R, v, G, geoFor, inselH, o = {}) {
  const cubes = [];
  const place = (r, side) => {
    const I = R.insel;
    if (r.key === 'back') { const ox = v.form === 'I' ? 15 : G.depth; return (a0, a1, c0, c1) => [ox + a0, ox + a1, v.wallGap + c0, v.wallGap + c1]; }
    if (r.key === 'left') return (a0, a1, c0, c1) => [v.wallGap + c0, v.wallGap + c1, G.depth + a0, G.depth + a1];
    if (r.key === 'right') return (a0, a1, c0, c1) => [v.Wb - v.wallGap - c1, v.Wb - v.wallGap - c0, G.depth + a0, G.depth + a1];
    const xl = I.cx - I.iDepth / 2, xr = I.cx + I.iDepth / 2;
    return side === 1 ? (a0, a1, c0, c1) => [xr - c1, xr - c0, I.y0 + a0, I.y0 + a1] : (a0, a1, c0, c1) => [xl + c0, xl + c1, I.y0 + a0, I.y0 + a1];
  };
  R.rows.forEach(r => {
    const gg = geoFor(r.key), H = r.key === 'insel' ? inselH : v.H;
    for (let side = 0; side < (r.mult || 1); side++) {
      const m = place(r, side);
      let pos = 0;
      (r.parts || []).forEach(p => {
        if (p.gap) { pos += p.w; return; }
        const off = pos;
        moduleCubes(p, v, gg, H, (a0, a1, c0, c1, z0, z1, c) => { const [x0, x1, y0, y1] = m(off + a0, off + a1, c0, c1); cubes.push({ x0, x1, y0, y1, z0, z1, c }); }, o);
        pos += p.len;
      });
    }
  });
  return cubes;
}

/* =====================================================================
   TOOL 1: Regal-Planer (Kantholz-Rahmen + Dachlatten)
   System nach „das boxenregal – Bauplan v0.1“, erweitert um
   normale Böden, freie Stapelfächer, Schrank, Lücken und eine Insel.
   Ablauf: Form → Maße → Vorlage → Fächer je Wand → Material → Bauplan
   ===================================================================== */
const SAMLA_TYPES = {
  G: { name: 'G (3× 65 + 45)', n65: 3, n22: 0 },
  M: { name: 'M (1× 65 + 45)', n65: 1, n22: 0 },
  K: { name: 'K (45 + 2× 22)', n65: 0, n22: 4 },
  A45: { name: 'nur 45 l', n65: 0, n22: 0 },
  A65: { name: 'nur 65 l', n65: 99, n22: 0 },
  A22: { name: 'nur 2× 22 l', n65: 0, n22: 99 },
};
const FACH_OPTS = [
  ...Object.entries(SAMLA_TYPES).map(([k, t]) => ['S:' + k, 'SAMLA ' + t.name]),
  ['boeden', 'Böden'], ['frei', 'Frei / Stapelfläche'], ['schrank', 'Schrank mit Türen'], ['luecke', 'Lücke (Heizkörper, Tür …)'],
];
const SAMLA_SEQ = ['G', 'M', 'K', 'K'];
const BOXLBL = { '65': '65 l', '45': '45 l', '22': '2× 22 l' };
const cmS = x => (Math.round(x) / 10).toFixed(1).replace('.', ',');
const isForm = (...f) => v => f.includes(v.form);
const ROWDEF = {
  back: 'Rückwand', left: 'Linke Wand', right: 'Rechte Wand', insel: 'Insel',
};

// ---- Geometrie-Grundlagen ----
function regalGeo(v) {
  const kb = v.kb, sgap = v.clear + 2 * v.lt;
  return {
    kb, sgap, raster: sgap + kb, postLen: v.H - 2 * kb, maxTop: v.H - kb - v.head,
    depth: v.T + v.wallGap,
    // erste Platte gleicht die Balkenhöhe aus → Schienenhöhen bleiben bei jedem Querschnitt gleich
    plates: { A: v.r28 + 20 - kb, B: v.r28 - 1, C: v.r65 + 20 - kb, D: v.r65 - 1 },
    hole2: Math.min(58, v.kt - 18), slim: v.kt < 70,
  };
}
const fachW = (f, G) => f.t === 'samla' ? G.sgap : Math.max(100, f.w || 0);
// Fächer in Module (Rahmen) aufteilen: Balken ≤ Lagerlänge, Lücken trennen
function splitModules(items, G, stock) {
  const parts = [];
  let cur = null;
  items.forEach((f, i) => {
    if (f.t === 'luecke') { cur = null; parts.push({ gap: true, w: f.w, f, i }); return; }
    const w = fachW(f, G);
    if (!cur || cur.len + w + G.kb > stock) { cur = { len: G.kb, items: [] }; parts.push(cur); }
    cur.items.push({ f, w, i }); cur.len += w + G.kb;
  });
  return parts;
}
const rowLen = (items, G, stock) => sum(splitModules(items, G, stock).map(p => p.gap ? p.w : p.len));

// SAMLA-Ebenen eines Fachs
function samlaLevels(type, v, G) {
  const ft = SAMLA_TYPES[type], lv = [];
  let prev = G.kb;
  const add = box => {
    const big = box === '65', first = !lv.length;
    const plate = big ? (first ? 'C' : 'D') : (first ? 'A' : 'B');
    const top = prev + G.plates[plate] + v.lh;
    if (top > G.maxTop) return false;
    lv.push({ box, plate, top }); prev = top; return true;
  };
  for (let i = 0; i < ft.n65; i++) if (!add('65')) break;
  while (add('45'));
  let k = ft.n22;
  for (let i = lv.length - 1; i >= 0 && k > 0; i--) if (lv[i].box === '45') { lv[i].box = '22'; k--; }
  return lv;
}
// Böden: gleichmäßig zwischen unterem und oberem Balken (Oberkante Boden)
function boardLevels(n, G, schrank) {
  if (schrank && n === 1) return [G.kb * 2 + G.postLen - 300];  // Einlegeboden 30 cm unter Oberkante (190 bei 220)
  const out = [];
  for (let i = 1; i <= n; i++) out.push(G.kb + i * G.postLen / (n + 1));
  return out;
}

// Verfügbare Längen je Reihe
function regalRows(v) {
  const G = regalGeo(v);
  const rows = [];
  const front = v.frontFree;
  if (v.form === 'I') rows.push({ key: 'back', usable: v.Wb - 30 });
  if (v.form === 'L') rows.push({ key: 'back', usable: v.Wb - G.depth - 30 }, { key: 'left', usable: v.D - G.depth - front });
  if (v.form === 'U') rows.push({ key: 'back', usable: v.Wb - 2 * G.depth }, { key: 'left', usable: v.D - G.depth - front }, { key: 'right', usable: v.D - G.depth - front });
  let insel = null;
  if (v.insel !== 'none') {
    const iDepth = v.insel === 'dbl' ? 2 * v.T + 20 : v.T;
    const x0 = v.form === 'I' ? 0 : G.depth, x1 = v.form === 'U' ? v.Wb - G.depth : v.Wb;
    const mid = x1 - x0;
    const gang = (mid - iDepth) / 2;
    const y0 = (v.form === 'I' ? G.depth : G.depth) + v.gang;
    const len = v.inselL > 0 ? v.inselL : v.D - y0 - v.gang;
    insel = { iDepth, x0, x1, gang, y0, len, cx: (x0 + x1) / 2 };
    rows.push({ key: 'insel', usable: len, mult: v.insel === 'dbl' ? 2 : 1 });
  }
  return { G, rows, insel };
}

// Automatische Belegung
function autoFill(usable, v, G, key) {
  const fits = items => rowLen(items, G, v.stock) <= usable;
  if (v.vorlage === 'keller') {
    const S = s => ({ t: 'samla', s });
    const plan = key === 'back' ? [S('G'), S('G'), { t: 'schrank', w: 2 * G.sgap + G.kb, n: 1 }, S('M')] : key === 'insel' ? null : [S('G'), S('M'), S('K'), S('K')];
    if (plan && fits(plan)) return plan;
    return autoFill(usable, { ...v, vorlage: 'mix' }, G, key);
  }
  const samlaFill = (base, limit) => {
    const items = base.slice();
    let k = 0;
    while (true) {
      const nx = items.concat([{ t: 'samla', s: SAMLA_SEQ[k % SAMLA_SEQ.length] }]);
      if (rowLen(nx, G, v.stock) > limit) break;
      items.push(nx[nx.length - 1]); k++;
    }
    return items;
  };
  if (v.vorlage === 'boxen') return samlaFill([], usable);
  if (v.vorlage === 'boeden') {
    for (let n = 1; n < 30; n++) {
      let w = Math.min(800, Math.floor(((usable - G.kb) / n - G.kb) / 10) * 10);
      const mk = () => Array.from({ length: n }, () => ({ t: 'boeden', w, n: 4 }));
      while (w >= 350 && !fits(mk())) w -= 10;
      if (w < 350) return [];
      // nur nehmen, wenn mit n Fächern weniger als ein weiteres Fach frei bleibt
      if (usable - rowLen(mk(), G, v.stock) < 350 + G.kb || n > 25) return mk();
    }
    return [];
  }
  // Mix: ein Bodenfach, Rest SAMLA, übrige Länge geht in das Bodenfach (max. 100 cm)
  const s = samlaFill([], usable - 600 - G.kb);
  if (!s.length) return autoFill(usable, { ...v, vorlage: 'boeden' }, G, key);
  const items = [{ t: 'boeden', w: 600, n: 4 }, ...s];
  if (!fits(items)) return s;
  // Bodenfach so weit verbreitern, wie es passt (max. 80 cm, sonst biegt OSB durch)
  while (items[0].w < 800) { items[0].w += 10; if (!fits(items)) { items[0].w -= 10; break; } }
  return items;
}
function resolveRows(v, st) {
  const R = regalRows(v);
  const saved = (st && st.rows) || {};
  R.rows.forEach(r => {
    const s = saved[r.key];
    r.auto = !s || s.auto !== false;
    r.items = r.auto ? autoFill(r.usable, v, R.G, r.key) : s.items.map(x => ({ ...x }));
    r.len = rowLen(r.items, R.G, v.stock);
  });
  return R;
}

  // ---- Fächer-Editor (Schritt 4) ----
  extra(v, st) {
    const R = resolveRows(v, st);
    let h = '<fieldset><legend>4 · Fächer je Wand</legend><p class="note" style="margin:0 0 6px">Automatisch gefüllt – jedes Fach lässt sich ändern. Breite gilt für Böden, Frei, Schrank und Lücke (SAMLA hat feste Breite).</p>';
    R.rows.forEach(r => {
      const over = r.len > r.usable + 0.5;
      h += `<div class="rowed"><h4><span>${ROWDEF[r.key]}${r.mult === 2 ? ' (beide Seiten gleich)' : ''}</span>` +
        `<button data-xbtn="auto" data-row="${r.key}">${r.auto ? 'automatisch ✓' : 'neu füllen'}</button></h4>` +
        `<div class="stat${over ? ' over' : ''}">Platz ${cmS(r.usable)} cm · belegt ${cmS(r.len)} cm${over ? ' – zu lang!' : ` · frei ${cmS(r.usable - r.len)} cm`}</div>`;
      h += '<div class="fr frh"><span></span><span>Fach</span><span>Breite mm</span><span>Böden</span><span></span></div>';
      r.items.forEach((f, i) => {
        const val = f.t === 'samla' ? 'S:' + f.s : f.t;
        const hasN = f.t === 'boeden' || f.t === 'schrank';
        h += `<div class="fr"><span class="nr">${i + 1}</span>` +
          `<select data-x="type" data-row="${r.key}" data-i="${i}">${FACH_OPTS.map(o => `<option value="${o[0]}"${o[0] === val ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>` +
          `<input type="number" inputmode="numeric" data-x="w" data-row="${r.key}" data-i="${i}" value="${f.t === 'samla' ? R.G.sgap : f.w}"${f.t === 'samla' ? ' disabled' : ''}>` +
          `<input type="number" inputmode="numeric" data-x="n" data-row="${r.key}" data-i="${i}" value="${hasN ? f.n : ''}"${hasN ? '' : ' disabled'}>` +
          `<button data-xbtn="del" data-row="${r.key}" data-i="${i}">✕</button></div>`;
      });
      h += `<div class="addrow"><button data-xbtn="add" data-row="${r.key}" data-t="S:G">+ SAMLA</button><button data-xbtn="add" data-row="${r.key}" data-t="boeden">+ Böden</button><button data-xbtn="add" data-row="${r.key}" data-t="frei">+ Frei</button><button data-xbtn="add" data-row="${r.key}" data-t="schrank">+ Schrank</button></div></div>`;
    });
    return h + '</fieldset>';
  },
  onExtra(st, el, kind) {
    const v = values(this);
    const R = resolveRows(v, st);
    const key = el.dataset.row, row = R.rows.find(r => r.key === key);
    if (!row) return;
    let items = row.items;
    const i = +el.dataset.i;
    const mk = t => t.startsWith('S:') ? { t: 'samla', s: t.slice(2) } : { t, w: t === 'luecke' ? 600 : t === 'frei' ? 800 : t === 'schrank' ? 908 : 800, n: t === 'schrank' ? 1 : 4 };
    if (kind === 'click') {
      const a = el.dataset.xbtn;
      if (a === 'auto') { st.rows = { ...(st.rows || {}), [key]: { auto: true } }; return; }
      if (a === 'del') items.splice(i, 1);
      if (a === 'add') items.push(mk(el.dataset.t));
    } else {
      const k = el.dataset.x;
      if (k === 'type') { const old = items[i]; items[i] = mk(el.value); if (old.w && items[i].t !== 'samla') items[i].w = old.w; }
      if (k === 'w') items[i].w = Math.max(100, Number(el.value) || 0);
      if (k === 'n') items[i].n = clamp(Number(el.value) | 0, 0, 12);
    }
    st.rows = { ...(st.rows || {}), [key]: { auto: false, items } };
  },

  compute(v) {
    const msgs = [], plan = { title: 'Regal – Bauplan', msgs, unit: 'cm' };
    const R = resolveRows(v, state[this.id]);
    const G = R.G, kb = G.kb;
    if (v.clear >= 380) msgs.push(['err', `Lichte Weite ${cmS(v.clear)} cm ist zu groß – der Box-Rand (39 cm) liegt kaum noch auf. Üblich: 36,5 cm.`]);
    if (v.form === 'U') {
      const g = v.Wb - 2 * G.depth;
      if (g < v.gang) msgs.push(['err', `Zwischen den Seitenreihen bleiben nur ${cmS(g)} cm.`]);
    }
    // Insel prüfen
    let inselH = v.H;
    if (R.insel) {
      const I = R.insel;
      if (I.gang < v.gang) msgs.push(['err', `Insel: links/rechts nur ${cmS(I.gang)} cm Gang (mind. ${cmS(v.gang)}). Insel einseitig bauen oder Raum breiter.`]);
      else msgs.push(['info', `Insel: ${cmS(I.gang)} cm Gang links und rechts, ${cmS(v.gang)} cm Abstand nach hinten.`]);
      if (I.len < kb + G.raster) msgs.push(['err', 'Insel: Raum zu kurz – Insel-Länge reicht für kein Fach.']);
      const base = v.insel === 'dbl' ? I.iDepth : v.T;
      const safeH = Math.floor(base * 3 / 10) * 10;
      inselH = v.inselH > 0 ? v.inselH : Math.min(v.H, safeH);
      if (inselH > base * 3) msgs.push(['warn', `Insel ${cmS(inselH)} cm hoch bei ${cmS(base)} cm Tiefe – Kippgefahr! Faustregel: höchstens 3 × Tiefe (${cmS(base * 3)} cm), sonst am Boden verschrauben.`]);
      else msgs.push(['info', `Insel-Höhe ${cmS(inselH)} cm (≤ 3 × Tiefe). Trotzdem mit Winkeln am Boden verschrauben.`]);
    }
    const geoFor = key => key === 'insel' && inselH !== v.H ? regalGeo({ ...v, H: inselH }) : G;

    // Module bilden
    const mods = [], gaps = [];
    R.rows.forEach(r => {
      if (r.len > r.usable + 0.5) msgs.push(['err', `${ROWDEF[r.key]}: Fächer sind ${cmS(r.len - r.usable)} cm zu lang für den Platz.`]);
      if (!r.items.length) msgs.push(['warn', `${ROWDEF[r.key]}: keine Fächer.`]);
      const g = geoFor(r.key);
      r.parts = splitModules(r.items, g, v.stock);
      r.parts.forEach(p => { if (p.gap) gaps.push(p); else mods.push({ ...p, row: r.key, mult: r.mult || 1, G: g, H: r.key === 'insel' ? inselH : v.H }); });
    });
    if (!mods.length) { msgs.push(['err', 'Kein Regalmodul geplant.']); plan.fatal = true; return plan; }

    // Mengen
    const kant = [], latt = [], osbParts = [];
    const boxes = { '65': 0, '45': 0, '22': 0 };
    const querFach = new Set(); let stangen = 0;
    let n6 = 0, nRailScrews = 0, n4x35 = 0, lochband = 0, nPads = 0, nWall = 0, nFloor = 0, nBoardScrews = 0, hinges = 0, handles = 0, nFach = 0;
    const cnt = { samla: 0, boeden: 0, frei: 0, schrank: 0 };
    const addN = (arr, n, len, label) => { for (let i = 0; i < n; i++) arr.push({ len, label }); };
    const osbAdd = (name, qty, l, b, t) => { const e = osbParts.find(p => p.name === name && p.l === l && p.b === b && p.t === t); if (e) e.qty += qty; else osbParts.push({ name, qty, l, b, t, mat: 'OSB' }); };
    mods.forEach(m => {
      const g = m.G, k = m.items.length, x = m.mult;
      addN(kant, 4 * x, m.len, 'A'); addN(kant, 2 * (k + 1) * x, g.postLen, 'B');
      n6 += 8 * (k + 1) * x; n4x35 += 20 * x; lochband += 2 * Math.hypot(m.len, m.H) * x;
      nPads += 2 * (Math.ceil(m.len / 1000) + 1) * x;
      if (m.row === 'insel') nFloor += 4 * x; else nWall += 2;
      m.items.forEach(({ f, w }) => {
        nFach += x; cnt[f.t] += x;
        if (f.t === 'samla') samlaLevels(f.s, v, g).forEach(l => { addN(latt, 2 * x, v.T, 'C'); nRailScrews += 8 * x; boxes[l.box] += (l.box === '22' ? 2 : 1) * x; });
        if (f.t === 'boeden' || f.t === 'schrank') {
          addN(latt, 2 * f.n * x, v.T, 'C'); nRailScrews += 8 * f.n * x;
          const bw = f.t === 'schrank' ? w - 2 * v.osb2 : w;
          osbAdd(f.t === 'schrank' ? 'Schrank Einlegeboden' : 'Boden', f.n * x, bw, v.T - 10, v.osb); nBoardScrews += 4 * f.n * x;
          if (w > v.osb * 40) { addN(latt, 2 * f.n * x, w, 'Q'); nRailScrews += 4 * f.n * x; querFach.add(cmS(w)); }
          if (w > v.osb * 80) msgs.push(['warn', `Fach ${cmS(w)} cm breit: auch mit Querlatten zu weit für OSB ${v.osb} mm – dickere Platte oder Fach schmaler.`]);
        }
        if (f.t === 'schrank') {
          osbAdd('Schrank Rückwand (hinten auf den Rahmen)', x, m.H, w + 2 * kb, v.osb2);
          osbAdd('Schrank Seite (innen an die Pfosten)', 2 * x, g.postLen, v.T, v.osb2);
          if (v.doors === 'neu') { osbAdd('Schranktür (aufliegend)', 2 * x, m.H - 10, (w + 2 * kb) / 2 - 2, v.osb2); hinges += 6 * x; handles += 2 * x; }
          stangen += x;
        }
      });
    });
    const kBins = packLengths(kant, v.stock, v.kerf), lBins = packLengths(latt, v.stock, v.kerf);
    if (querFach.size) msgs.push(['info', `OSB ${v.osb} mm: Fächer ${[...querFach].join(', ')} cm breit bekommen je Boden 2 Querlatten (vorne + hinten zwischen die Pfosten), damit der Boden nicht durchhängt.`]);
    if (kBins.some(b => b.over)) msgs.push(['err', `Ein Teil ist länger als ${cmS(v.stock)} cm.`]);
    const osbArea = sum(osbParts.map(p => p.qty * p.l * p.b)) / 1e6;
    const osbSheets = osbArea ? Math.ceil(osbArea * 1.2 / 3.125) : 0;
    const nBox = boxes['65'] + boxes['45'] + boxes['22'];
    const holz = kBins.length * v.pK + lBins.length * v.pL + osbSheets * v.pO;
    const besch = n6 * 0.35 + nRailScrews * 0.06 + Math.ceil(lochband / 1000) * 1.5 + n4x35 * 0.04 + (nWall + nFloor) * 2.5 + nPads * 0.3 + nBoardScrews * 0.05 + hinges * 3 + handles * 3;

    plan.kpis = [
      ['Fächer', `${nFach} (${[cnt.samla && cnt.samla + ' SAMLA', cnt.boeden && cnt.boeden + ' Böden', cnt.schrank && cnt.schrank + ' Schrank', cnt.frei && cnt.frei + ' frei'].filter(Boolean).join(' · ')})`],
      ['SAMLA-Boxen', nBox ? `${nBox}: ${boxes['65']}× 65 · ${boxes['45']}× 45 · ${boxes['22']}× 22` : '–'],
      ['Module (Rahmenpaare)', String(sum(mods.map(m => m.mult)))],
      ['Holz', `${kBins.length} Kantholz · ${lBins.length} Latten${osbSheets ? ' · ' + osbSheets + ' OSB' : ''}`],
      ['Material ca.', `${Math.round(holz + besch)} €`],
    ];

    // ---- Grundriss ----
    const D = v.D, Wb = v.Wb;
    const fs = Math.max(Wb, D) / 34;
    let g = S.rect(0, 0, Wb, D, 'fill="#fffdf8" stroke="#333" stroke-width="3"');
    const label = (cx, cy, txt, rot) => `<text x="${cx}" y="${cy}" font-size="${fs * 0.6}" text-anchor="middle" ${rot ? `transform="rotate(-90 ${cx} ${cy})"` : ''}>${esc(txt)}</text>`;
    const fillOf = f => f.t === 'samla' ? '#c9d8ec' : f.t === 'boeden' ? '#f6e3c4' : f.t === 'schrank' ? '#ffffff' : f.t === 'frei' ? '#e8e2d6' : 'none';
    const short = f => f.t === 'samla' ? f.s.replace('A', '') : f.t === 'boeden' ? 'Böden' : f.t === 'schrank' ? 'Schrank' : f.t === 'frei' ? 'frei' : 'Lücke';
    const drawPlanRow = (r, horiz, x0, y0, depthT) => {
      let pos = 0;
      r.parts.forEach(p => {
        if (p.gap) {
          const rx = horiz ? x0 + pos : x0, ry = horiz ? y0 : y0 + pos;
          g += S.rect(rx, ry, horiz ? p.w : depthT, horiz ? depthT : p.w, 'fill="none" stroke="#9aa3ad" stroke-dasharray="8 6"');
          g += label(horiz ? rx + p.w / 2 : rx + depthT / 2, horiz ? ry + depthT / 2 : ry + p.w / 2, 'Lücke', !horiz);
          pos += p.w; return;
        }
        let q = pos;
        p.items.forEach(it => {
          const a = q + kb;
          const rx = horiz ? x0 + a : x0, ry = horiz ? y0 : y0 + a;
          g += S.rect(rx, ry, horiz ? it.w : depthT, horiz ? depthT : it.w, `fill="${fillOf(it.f)}" stroke="#8a7a60"`);
          g += label(horiz ? rx + it.w / 2 : rx + depthT / 2, horiz ? ry + depthT / 2 + fs * 0.2 : ry + it.w / 2, short(it.f), !horiz);
          q += kb + it.w;
        });
        for (let j = 0, z = pos; j <= p.items.length; j++) {
          g += horiz ? S.rect(x0 + z, y0, kb, depthT, 'class="wood2"') : S.rect(x0, y0 + z, depthT, kb, 'class="wood2"');
          if (j < p.items.length) z += kb + p.items[j].w;
        }
        pos += p.len;
      });
    };
    const rowBy = k => R.rows.find(r => r.key === k);
    const corner = (x, y) => { g += S.rect(x, y, G.depth, G.depth, 'fill="#f3f0ea" stroke="#9aa3ad" stroke-dasharray="8 6"') + label(x + G.depth / 2, y + G.depth / 2, 'Ecke frei'); };
    if (v.form === 'I') drawPlanRow(rowBy('back'), true, 15, v.wallGap, v.T);
    if (v.form === 'L') { corner(0, 0); drawPlanRow(rowBy('back'), true, G.depth, v.wallGap, v.T); drawPlanRow(rowBy('left'), false, v.wallGap, G.depth, v.T); }
    if (v.form === 'U') {
      corner(0, 0); corner(Wb - G.depth, 0);
      drawPlanRow(rowBy('back'), true, G.depth, v.wallGap, v.T);
      drawPlanRow(rowBy('left'), false, v.wallGap, G.depth, v.T);
      drawPlanRow(rowBy('right'), false, Wb - G.depth, G.depth, v.T);
    }
    if (R.insel) {
      const I = R.insel;
      drawPlanRow(rowBy('insel'), false, I.cx - I.iDepth / 2, I.y0, I.iDepth);
      g += dimH(I.x0, I.cx - I.iDepth / 2, I.y0 + fs * 2, cmS(I.gang), fs * 0.8);
      g += dimH(I.cx + I.iDepth / 2, I.x1, I.y0 + fs * 2, cmS(I.gang), fs * 0.8);
      g += dimV(I.y0 - v.gang, I.y0, I.cx, cmS(v.gang), fs * 0.8);
    }
    g += dimH(0, Wb, -fs * 0.9, `${cmS(Wb)}`, fs) + dimV(0, D, -fs * 0.9, `${cmS(D)}`, fs);
    const grund = drawing(-fs * 2.2, -fs * 2.4, Wb + fs * 4.4, D + fs * 3.4, g, 'Grundriss (Maße in cm). Blau = SAMLA · beige = Böden · weiß = Schrank · grau = frei/Stapelfläche · dunkel = Pfosten.');

    // ---- Vorderansichten je Reihe ----
    const fronts = [];
    R.rows.forEach(r => {
      const gg = geoFor(r.key), H = r.key === 'insel' ? inselH : v.H;
      const total = r.len;
      if (!total) return;
      const f2 = Math.max(total, H) / 34;
      let h = '', x = 0;
      r.parts.forEach(p => {
        if (p.gap) { h += S.rect(x, 0, p.w, H, 'fill="none" stroke="#9aa3ad" stroke-dasharray="8 6"') + S.text(x + p.w / 2, H / 2, 'Lücke', `font-size="${f2 * 0.7}" text-anchor="middle" class="lbl"`); x += p.w; return; }
        h += S.rect(x, 0, p.len, gg.kb, 'class="wood2"') + S.rect(x, H - gg.kb, p.len, gg.kb, 'class="wood2"');
        let q = x;
        h += S.rect(q, gg.kb, gg.kb, gg.postLen, 'class="wood2"');
        p.items.forEach(({ f, w }) => {
          const x0 = q + gg.kb;
          if (f.t === 'samla') samlaLevels(f.s, v, gg).forEach(l => {
            const y = H - l.top, rr = l.box === '65' ? v.r65 : v.r28;
            h += S.rect(x0 + w / 2 - 195, y - 15, 390, rr + 15, 'class="box"') + S.rect(x0 + w / 2 - 195, y - 15, 390, 15, 'class="boxrim"');
            h += S.rect(x0, y, v.lt, v.lh, 'fill="#111"') + S.rect(x0 + w - v.lt, y, v.lt, v.lh, 'fill="#111"');
            h += S.text(x0 + w / 2, y + rr / 2 + f2 * 0.3, BOXLBL[l.box], `font-size="${f2 * 0.6}" text-anchor="middle" class="lbl"`);
          });
          if (f.t === 'boeden' || f.t === 'schrank') boardLevels(f.n, gg, f.t === 'schrank').forEach(top => {
            const y = H - top;
            h += S.rect(x0, y, w, v.osb, 'class="wood"') + S.rect(x0, y + v.osb, v.lt, v.lh, 'fill="#111"') + S.rect(x0 + w - v.lt, y + v.osb, v.lt, v.lh, 'fill="#111"');
          });
          if (f.t === 'schrank') {
            h += S.rect(x0 - gg.kb / 2, gg.kb, w + gg.kb, gg.postLen, 'fill="#ffffff" fill-opacity="0.85" stroke="#555"');
            h += S.line(x0 + w / 2, gg.kb, x0 + w / 2, H - gg.kb, 'stroke="#555"');
            h += S.text(x0 + w / 2, H / 2, 'Schrank', `font-size="${f2 * 0.7}" text-anchor="middle" class="lbl"`);
          }
          if (f.t === 'frei') h += S.text(x0 + w / 2, H / 2, 'frei', `font-size="${f2 * 0.7}" text-anchor="middle" class="lbl"`);
          h += S.text(x0 + w / 2, H + f2 * 1.1, short(f), `font-size="${f2 * 0.7}" text-anchor="middle" font-weight="700"`);
          q = x0 + w;
          h += S.rect(q, gg.kb, gg.kb, gg.postLen, 'class="wood2"');
        });
        h += dimH(x, x + p.len, -f2 * 0.8, cmS(p.len), f2 * 0.7);
        x += p.len;
      });
      h += dimV(0, H, -f2 * 0.9, cmS(H), f2 * 0.8);
      fronts.push(drawing(-f2 * 2.2, -f2 * 2.2, total + f2 * 3.4, H + f2 * 3.8, h, `Vorderansicht ${ROWDEF[r.key]}${r.mult === 2 ? ' (beide Seiten)' : ''} – Maße über den Modulen = Balkenlänge`));
    });

    // ---- 3D ----
    const VN = { vr: 'von vorne rechts', vl: 'von vorne links', hl: 'von hinten links', hr: 'von hinten rechts' };
    const iso = v.view3d === 'off' ? '' : iso3dSvg(layoutCubes(R, v, G, geoFor, inselH, { boxes: true }), { w: v.Wb, d: v.D }, v.view3d, `3D-Ansicht ${VN[v.view3d]} (Blickrichtung im Formular unter „5 · 3D-Ansicht“ ändern)`);
    plan.drawings = [grund, ...(iso ? [iso] : []), ...fronts];

    // Tabellen
    let tb = '<div class="tablewrap"><table><tr><th>Wand</th><th>#</th><th>Fach</th><th class="n">Breite</th><th>Platten / Höhen (cm)</th><th>Inhalt</th></tr>';
    R.rows.forEach(r => {
      const gg = geoFor(r.key);
      r.items.forEach((f, i) => {
        let pl = '', inh = '';
        if (f.t === 'samla') {
          const lv = samlaLevels(f.s, v, gg);
          const c = { '65': 0, '45': 0, '22': 0 }; lv.forEach(l => { c[l.box] += l.box === '22' ? 2 : 1; });
          pl = lv.map(l => l.plate).join('') + ' · ' + lv.map(l => cmS(l.top)).join(' · ');
          inh = Object.entries(c).filter(e => e[1]).map(e => `${e[1]}× ${e[0]} l`).join(' + ');
        } else if (f.t === 'boeden' || f.t === 'schrank') {
          const lv = boardLevels(f.n, gg, f.t === 'schrank');
          pl = lv.map(t => cmS(t)).join(' · ');
          inh = `${f.n} Böden${f.t === 'schrank' ? ', 2 Türen' : ''}`;
        } else inh = f.t === 'frei' ? 'Stapelfläche (Kartons)' : 'kein Regal';
        tb += `<tr><td>${i ? '' : ROWDEF[r.key] + (r.mult === 2 ? ' ×2' : '')}</td><td>${i + 1}</td><td>${esc(short(f))}</td><td class="n">${cmS(fachW(f, gg))}</td><td>${pl}</td><td>${inh}</td></tr>`;
      });
    });
    tb += `</table></div><p class="note">SAMLA: Buchstaben = Abstandsplatten von unten, Zahlen = Schienen-Oberkante ab Boden. Böden: Oberkante Latte ab Boden. Raster SAMLA ${cmS(G.raster)} · lichte Weite ${cmS(v.clear)}.</p>`;
    plan.afterDrawings = '<h3>Fächer</h3>' + tb;

    // Teile
    const bal = {};
    mods.forEach(m => { bal[m.len] = (bal[m.len] || 0) + 4 * m.mult; });
    const posts = {};
    mods.forEach(m => { posts[m.G.postLen] = (posts[m.G.postLen] || 0) + 2 * (m.items.length + 1) * m.mult; });
    plan.parts = [
      ...Object.entries(bal).map(([L, q]) => ({ name: 'A Balken', qty: q, l: +L, b: v.kt, t: kb, mat: 'Kantholz sägerau', note: '2 je Rahmen' })),
      ...Object.entries(posts).map(([L, q]) => ({ name: 'B Pfosten', qty: q, l: +L, b: v.kt, t: kb, mat: 'Kantholz sägerau' })),
      { name: 'C Latte (Schiene/Auflage)', qty: latt.filter(i => i.label === 'C').length, l: v.T, b: v.lh, t: v.lt, mat: 'Dachlatte sägerau', note: 'vorne + hinten an die Pfosten' },
      ...[...new Set(latt.filter(i => i.label === 'Q').map(i => i.len))].map(L => ({ name: 'Q Querlatte unter Boden', qty: latt.filter(i => i.label === 'Q' && i.len === L).length, l: L, b: v.lh, t: v.lt, mat: 'Dachlatte sägerau', note: 'vorne + hinten zwischen die Pfosten' })),
      ...osbParts,
    ];
    const sm = (v.stock / 1000).toFixed(1).replace('.', ',');
    plan.cutplan = `<p><b>Kantholz ${sm} m → Balken (A) und Pfosten (B):</b> ${kBins.length} Hölzer.</p>` +
      stripPlanSvg(kBins, v.stock, Math.max(60, v.kt), 99, 'Zuschnitt Kantholz (Maße in mm). Reste → Abstandshölzer und Schablonen.', { group: true, name: `Kantholz ${sm} m` }) +
      `<p><b>Dachlatten ${sm} m → Latten (C):</b> ${lBins.length} Stück.</p>` +
      stripPlanSvg(lBins, v.stock, v.lh, 99, 'Zuschnitt Dachlatten (Maße in mm).', { group: true, name: `Dachlatte ${sm} m` }) +
      (osbSheets ? `<p><b>OSB:</b> ca. ${osbArea.toFixed(2).replace('.', ',')} m² → ${osbSheets} Platte(n) 250 × 125 (inkl. 20 % Verschnitt). Im Baumarkt nach Zuschnittliste schneiden lassen.</p>` : '');
    const boardSpacers = [...new Set(R.rows.flatMap(r => r.items.filter(f => f.t === 'boeden').map(f => Math.round(geoFor(r.key).postLen / (f.n + 1) - v.lh))))];
    plan.jigs = [
      ['Maßlatten mit Endanschlag', [v.T, ...Object.keys(bal).map(Number), ...Object.keys(posts).map(Number)].map(cmS).join(' · ') + ' cm', 'je eine pro Länge'],
      ...(nBox ? [['Abstandsplatten A / B / C / D', ['A', 'B', 'C', 'D'].map(k => cmS(G.plates[k])).join(' / ') + ' cm', 'SAMLA-Schienen: A/C erste Schiene vom Balken, B/D jede weitere (A/B 45 + 22 l, C/D 65 l)']] : []),
      ...boardSpacers.map(s => ['Abstandsplatte Böden', cmS(s) + ' cm', 'Abstand Latte → nächste Latte bei Bodenfächern']),
      ['Abstandshölzer SAMLA', cmS(G.sgap) + ' cm', 'Pfostenabstand bei SAMLA-Fächern'],
      ...[...new Set(R.rows.flatMap(r => r.items.filter(f => f.t !== 'samla' && f.t !== 'luecke').map(f => f.w)))].map(w => ['Abstandsholz', cmS(w) + ' cm', 'Pfostenabstand für Fach dieser Breite']),
      ['Schraubschablone A/B', '1:1 Papier', 'Latten-Enden vorbohren, siehe unten'],
      ...(nBox ? [['Prüfstab', cmS(v.clear) + ' cm', 'muss leicht zwischen den Schienen durchgehen']] : []),
    ];
    plan.buy = [
      [`Kantholz sägerau ${v.kt} × ${kb} mm, ${sm} m`, `${kBins.length} Stk`, `ca. ${Math.round(kBins.length * v.pK)} €`],
      [`Dachlatte sägerau ${v.lh} × ${v.lt} mm, ${sm} m`, `${lBins.length} Stk`, `ca. ${Math.round(lBins.length * v.pL)} €`],
      ...(osbSheets ? [[`OSB-Platte ${v.osb} / ${v.osb2} mm`, `${osbSheets} Stk`, `ca. ${Math.round(osbSheets * v.pO)} € – Stärken laut Zuschnittliste`]] : []),
      [G.slim ? 'Holzschraube 5 × 100, 3 mm vorbohren' : 'Holzschraube 6 × 120 Teilgewinde', `${n6} Stk`, 'Balken an Pfosten'],
      [G.slim ? 'Holzschraube 4 × 50' : 'Holzschraube 4,5 × 60', `${nRailScrews} Stk`, 'Latten, 2 je Ende'],
      ...(nBoardScrews ? [['Holzschraube 4 × 30', `${nBoardScrews} Stk`, 'Böden auf Latten']] : []),
      ['Lochband 20 mm', `${Math.ceil(lochband / 1000)} m`, 'Diagonale je Rahmen'],
      ['Holzschraube 4 × 35', `${n4x35} Stk`, 'Lochband'],
      ...(nWall ? [['Winkelverbinder 90 × 90 × 40 + Dübel 8 mm', `${nWall} Stk`, 'Wandanker, 2 je Wandmodul']] : []),
      ...(nFloor ? [['Winkelverbinder + Bodenanker', `${nFloor} Stk`, 'Insel am Boden verschrauben']] : []),
      ['Unterlegplatte Kunststoff 3–5 mm', `${nPads} Stk`, 'unter die Bodenbalken'],
      ...(hinges ? [['Möbelscharnier / Aufschraubband', `${hinges} Stk`, '3 je Tür'], ['Griff + Magnetschnäpper', `${handles} Stk`, '1 je Tür']] : []),
      ...(stangen ? [['Kleiderstange Ovalrohr + 2 Halter', `${stangen} Satz`, 'im Schrank auf ca. 180 cm'], ['Holzschraube 4 × 40', '1 Pck.', 'OSB an die Pfosten']] : []),
      ...(stangen && v.doors === 'alt' ? [['alte Schranktüren + Scharniere', `${stangen * 2} Türen`, 'Montageplatten durch die OSB-Seite in den Pfosten']] : []),
      ...['65', '45', '22'].filter(k => boxes[k]).map(k => [`IKEA SAMLA mit Deckel ${k} l`, `${boxes[k]} Stk`, '']),
    ];
    plan.steps = [
      `<b>Schablonen bauen</b> (einmal, aus Resten): Maßlatten, Abstandsplatten${nBox ? ' A–D' : ''}, Abstandshölzer für jede Fachbreite, Schraubschablone.`,
      `<b>Zuschneiden</b> laut Zuschnittliste – immer mit der Maßlatte am frischen Ende.${osbSheets ? ' OSB im Baumarkt schneiden lassen.' : ''}`,
      `<b>Rahmen liegend bauen:</b> 2 Balken flach hinlegen, ersten Pfosten bündig. Passendes Abstandsholz für das jeweilige Fach einlegen, nächsten Pfosten dagegen, 2 × ${G.slim ? '5 × 100 (vorbohren, Hirnholz reißt sonst)' : '6 × 120'} je Ende. Pro Modul 2 Rahmen.${G.slim ? ' Variante B ist weicher: Lochband-Diagonalen und Wandwinkel sind Pflicht.' : ''}`,
      `<b>Rechtwinklig + Lochband:</b> Diagonalen gleich lang? Dann eine Diagonale Lochband auf die Rückseite.`,
      `<b>Aufstellen:</b> Unterlegplatten unter die Balken. Hinteren Rahmen mit ${cmS(v.wallGap)} cm Wandabstand, vorderen ${cmS(v.T)} cm davor.${R.insel ? ` Insel: ${v.insel === 'dbl' ? 'zwei Regale Rücken an Rücken stellen und verschrauben, ' : ''}mit Winkeln am Boden verschrauben.` : ''}`,
      `<b>Latten von unten nach oben:</b> Abstandsplatte auf Balken bzw. untere Latte stellen, Latte auflegen, mit Schraubschablone vorbohren, 2 × ${G.slim ? '4 × 50' : '4,5 × 60'} je Ende. Linke Latte Bohrbild A, rechte B.`,
      ...(cnt.boeden ? [`<b>Böden:</b> OSB-Böden auf die Latten legen, je 4 Schrauben 4 × 30.${querFach.size ? ' In breiten Fächern vorher die Querlatten vorne und hinten zwischen die Pfosten schrauben (Oberkante = Oberkante Seitenlatte).' : ''}`] : []),
      ...(cnt.schrank ? [`<b>Schrank</b> (ohne Mittelpfosten – beim Rahmenbau 2 Abstandshölzer + ${cmS(kb)} cm Klotz statt Pfosten): OSB-Rückwand hinten auf den Rahmen (alle ca. 20 cm), OSB-Seiten innen an die Pfosten, 2 Latten auf ca. ${cmS(v.H - 300)} cm und Einlegeboden auflegen, Kleiderstange auf ca. ${cmS(v.H - 400)} cm, Türen ${v.doors === 'alt' ? '(die alten) ' : ''}einhängen und einstellen. Regal auf Unterlegplatten, damit die Türen nicht schleifen.`] : []),
      `<b>Sichern:</b> Wandmodule oben mit 2 Winkeln an die Wand. Benachbarte Module verschrauben${v.form !== 'I' ? ', Ecken mit Kantholz-Rest über der Stoßkante' : ''}.`,
      ...(nBox ? [`<b>Boxen einhängen:</b> Prüfstab ${cmS(v.clear)} cm muss leicht durchgehen. Schienen-Oberkanten anschleifen. Schweres nach unten, max. ca. 15 kg je Box.`] : []),
    ];
    msgs.push(['info', 'Vor dem Bohren Leitungen prüfen. Im Keller Holz einige Tage akklimatisieren. Entwurf – erstes Fach mit echten Boxen testen.']);

    plan.data = { v, R, G, geoFor, inselH, mods, kBins, lBins, boxes, nBox, nFach, cnt, osbParts, osbSheets, holz, besch, bal, posts, latt,
      n6, nRailScrews, nBoardScrews, n4x35, lochband, nWall, nFloor, nPads, hinges, handles, stangen, querFach };
    // Schraubschablone
    const sw = 100, sh = v.lh;
    const tpl = (pat, y0) => {
      let b = S.rect(0, y0, sw, sh, 'fill="none" stroke="#000" stroke-width="0.3"');
      b += S.line(0, y0, sw, y0, 'stroke="#000" stroke-width="1"') + S.line(sw, y0, sw, y0 + sh, 'stroke="#000" stroke-width="1"');
      b += S.text(2, y0 - 2, `Bohrbild ${pat} – ${pat === 'A' ? 'linke' : 'rechte'} Latte eines Fachs · Anschlag oben + Ende (dick)`, 'font-size="3"');
      const h2 = G.hole2;
      (pat === 'A' ? [[sw - 20, 15], [sw - h2, 35]] : [[sw - h2, 15], [sw - 20, 35]]).forEach(([x, y]) => { b += holeMark(x, y0 + y, 3); });
      b += S.text(sw - 20, y0 + sh + 4, '2,0', 'font-size="2.6" text-anchor="middle"') + S.text(sw - h2, y0 + sh + 4, cmS(h2), 'font-size="2.6" text-anchor="middle"');
      b += S.text(sw + 2, y0 + 16, '1,5', 'font-size="2.6"') + S.text(sw + 2, y0 + 36, '3,5', 'font-size="2.6"');
      return b;
    };
    plan.templates = [{ title: 'Schraubschablone Latten-Ende A/B', w: 120, h: 2 * sh + 40, body: tpl('A', 10) + tpl('B', 10 + sh + 20), hint: 'an beiden Enden verwenden, immer vom Ende aus' }];
    return plan;
  },
};

/* =====================================================================
   TOOL 2: French-Cleat-Wand
   ===================================================================== */
const MODS = {
  ablage: { name: 'Ablage', def: { w: 400, h: 150, d: 200 } },
  fach: { name: 'Fach/Kasten', def: { w: 300, h: 200, d: 150 } },
  werkzeug: { name: 'Werkzeughalter', def: { w: 400, h: 120, d: 80 } },
  haken: { name: 'Hakenleiste', def: { w: 300, h: 120, d: 0 } },
};
const DEFAULT_MODULES = [
  { type: 'ablage', qty: 2, w: 400, h: 150, d: 200 },
  { type: 'fach', qty: 2, w: 300, h: 200, d: 150 },
  { type: 'werkzeug', qty: 1, w: 400, h: 120, d: 80 },
  { type: 'haken', qty: 1, w: 300, h: 120, d: 0 },
];

const toolCleat = {
  id: 'cleat',
  title: 'French Cleat',
  fields: [
    { g: 'Wandfläche', id: 'W', label: 'Breite', def: 1200, unit: 'mm' },
    { g: 'Wandfläche', id: 'Hw', label: 'Höhe', def: 1000, unit: 'mm' },
    { g: 'Wandfläche', id: 'board', label: 'Trägerplatte', type: 'select', def: 'none', options: [['none', 'Leisten direkt an die Wand'], ['ply', 'auf Platte 12 mm (dann an Wand)']] },
    { g: 'Leisten', id: 'pitch', label: 'Leistenabstand (Raster)', def: 150, unit: 'mm', help: 'Oberkante zu Oberkante' },
    { g: 'Leisten', id: 'ch', label: 'Leistenhöhe (lange Seite)', def: 70, unit: 'mm' },
    { g: 'Leisten', id: 't', label: 'Materialstärke', def: 18, unit: 'mm' },
    { g: 'Leisten', id: 'stock', label: 'Brett-Lagerlänge', def: 2400, unit: 'mm' },
    { g: 'Leisten', id: 'kerf', label: 'Schnittbreite Säge', def: 3, unit: 'mm' },
    { g: 'Werkzeughalter', id: 'holeD', label: 'Loch-Ø', def: 12, unit: 'mm' },
    { g: 'Werkzeughalter', id: 'holeSp', label: 'Lochabstand', def: 40, unit: 'mm' },
    { g: 'Module', id: 'modules', type: 'modules', def: DEFAULT_MODULES },
  ],
  compute(v) {
    const msgs = [], plan = { title: 'French-Cleat-Wand', msgs };
    const t = v.t, ch = v.ch;
    if (ch < t + 20) { msgs.push(['err', `Leistenhöhe muss mindestens ${t + 20} mm sein (Materialstärke + 20).`]); plan.fatal = true; return plan; }
    if (v.pitch < ch + 20) msgs.push(['warn', `Raster ${mm(v.pitch)} ist sehr eng – zwischen den Leisten bleiben nur ${mm(v.pitch - ch)}. Empfohlen: ≥ ${mm(ch + 50)}.`]);
    const top0 = 40;                                   // Oberkante 1. Leiste unter Oberkante Fläche
    const nRows = Math.max(1, Math.floor((v.Hw - top0 - ch) / v.pitch) + 1);
    const rowsY = Array.from({ length: nRows }, (_, i) => top0 + i * v.pitch);
    const pieces = Math.ceil(v.W / v.stock);
    const pieceLen = v.W / pieces;
    const ripW = 2 * ch - t + 4;

    // Module expandieren
    const inst = [];
    const parts = [], tplMap = {};
    let modScrews = 0, hooks = 0;
    const partAdd = (name, qty, l, b, tt, mat, note) => {
      const ex = parts.find(p => p.name === name && p.l === l && p.b === b && p.t === tt);
      if (ex) ex.qty += qty; else parts.push({ name, qty, l, b, t: tt, mat, note });
    };
    v.modules.forEach((m, idx) => {
      const w = m.w, q = Math.max(0, m.qty | 0);
      if (!q || w <= 0) return;
      const backH = Math.max(m.h, ch + 50);
      const label = `${MODS[m.type].name} ${w}`;
      partAdd(`${label}: Rückwand`, q, w, backH, t, 'Platte', '');
      partAdd(`${label}: Modulleiste 45°`, q, w, ch, t, 'aus Leistenstreifen', 'Schräge nach unten, Spitze zur Wand');
      partAdd(`${label}: Abstandsleiste`, q, w, 30, t, 'Platte/Rest', 'unten hinten, gleiche Stärke wie Leiste');
      let extraH = 0;
      if (m.type === 'ablage' || m.type === 'werkzeug') {
        const d = Math.max(m.d, t + 30);
        partAdd(`${label}: ${m.type === 'ablage' ? 'Boden' : 'Lochbrett'}`, q, w, d, t, 'Platte', m.type === 'werkzeug' ? 'Bohrschablone siehe unten' : '');
        const a = d - t, b = backH;
        partAdd(`${label}: Konsole (Dreieck)`, q * 2, a, b, t, 'Platte', 'Schablone 1:1 siehe unten');
        const key = `${a}x${b}`;
        if (!tplMap[key]) tplMap[key] = { a, b };
        extraH = t;
        modScrews += q * (Math.ceil(w / 150) + 2 * 4);
        if (m.type === 'werkzeug') {
          const n = Math.max(1, Math.floor((w - 60) / v.holeSp) + 1);
          tplMap['holes' + w + 'x' + d] = { holes: true, w, d, n };
        }
      } else if (m.type === 'fach') {
        const d = Math.max(m.d, t + 30), h = Math.min(m.h, backH);
        partAdd(`${label}: Seite`, q * 2, h, d - t, t, 'Platte', '');
        partAdd(`${label}: Boden`, q, w - 2 * t, d - t, t, 'Platte', '');
        partAdd(`${label}: Front`, q, w - 2 * t, Math.round(h * 0.4), t, 'Platte', 'niedrige Front, oben offen');
        modScrews += q * 14;
      } else if (m.type === 'haken') {
        const n = Math.max(1, Math.floor((w - 40) / 80) + 1);
        hooks += n * q;
      }
      modScrews += q * (Math.ceil(w / 120) + 2);
      for (let i = 0; i < q; i++) inst.push({ idx, type: m.type, w, h: backH + extraH, depth: m.d, name: MODS[m.type].name });
    });

    // Wandleisten
    partAdd('Wandleiste 45°', nRows * pieces, pieceLen, ch, t, 'aus Leistenstreifen', 'Schräge nach oben, Spitze vorne oben');
    if (v.board === 'ply') partAdd('Trägerplatte', 1, v.W, v.Hw, 12, 'Sperrholz/OSB 12 mm', 'bei Übergröße teilen, Stoß auf Leistenmitte');
    const lehre = v.pitch - ch;
    partAdd('Abstandslehre', 2, lehre, 60, t, 'Rest', 'Raster ohne Messen');

    // Zuschnitt Leisten: jeder Streifen ergibt 2 Leisten
    const cleatItems = [];
    for (let i = 0; i < nRows * pieces; i++) cleatItems.push({ len: pieceLen, label: 'Wand' });
    v.modules.forEach(m => { for (let i = 0; i < (m.qty | 0); i++) if (m.w > 0) cleatItems.push({ len: m.w, label: 'Modul' }); });
    const bins = packLengths(cleatItems, v.stock, v.kerf);
    const boards = Math.ceil(bins.length / 2);
    const plateArea = sum(parts.filter(p => p.mat === 'Platte' || p.mat === 'Platte/Rest').map(p => p.qty * p.l * p.b)) / 1e6;

    // Layout auf der Wand
    const placed = [], notPlaced = [];
    const gapM = 10;
    inst.sort((a, b) => b.h - a.h || b.w - a.w).forEach(m => {
      let ok = false;
      for (let r = 0; r < nRows && !ok; r++) {
        const top = rowsY[r] - (ch - t) - (m.type === 'ablage' || m.type === 'werkzeug' ? t : 0);
        const bot = top + m.h;
        if (top < 0 || bot > v.Hw) continue;
        const xs = [0, ...placed.map(p => p.x + p.w + gapM)].sort((a, b) => a - b);
        for (const x of xs) {
          if (x + m.w > v.W) continue;
          const hit = placed.some(p => x < p.x + p.w + gapM && x + m.w + gapM > p.x && top < p.y + p.h + gapM && bot + gapM > p.y);
          if (!hit) { placed.push({ ...m, x, y: top }); ok = true; break; }
        }
      }
      if (!ok) notPlaced.push(m);
    });
    if (notPlaced.length) msgs.push(['warn', `${notPlaced.length} Modul(e) passen im Vorschlag nicht auf die Fläche: ${notPlaced.map(m => m.name + ' ' + m.w).join(', ')}. Fläche vergrößern oder Module verkleinern.`]);

    plan.kpis = [
      ['Wandleisten-Reihen', `${nRows} × ${num(v.W)}`],
      ['Module', String(inst.length)],
      ['Leistenstreifen', `${boards} Brett(er) ${t}×${num(ripW)}×${v.stock}`],
      ['Plattenmaterial Module', `ca. ${(plateArea * 1.25).toFixed(2).replace('.', ',')} m²`],
      ['Abstandslehre', mm(lehre)],
    ];

    // --- Zeichnung Wand ---
    const fs = Math.max(v.W, v.Hw) / 34;
    let g = S.rect(0, 0, v.W, v.Hw, v.board === 'ply' ? 'class="wood"' : 'class="wall"');
    rowsY.forEach(y => {
      for (let i = 0; i < pieces; i++) g += S.rect(i * pieceLen + (i ? 2 : 0), y, pieceLen - (i ? 2 : 0), ch, 'class="wood2"');
    });
    placed.forEach(p => {
      g += S.rect(p.x, p.y, p.w, p.h, 'class="mod"');
      g += S.text(p.x + p.w / 2, p.y + p.h / 2 + fs * 0.3, `${p.name} ${p.w}`, `font-size="${fs * 0.7}" text-anchor="middle" class="lbl"`);
    });
    g += dimH(0, v.W, -fs * 0.8, num(v.W), fs);
    g += dimV(0, v.Hw, -fs * 0.9, num(v.Hw), fs);
    if (nRows > 1) g += dimV(rowsY[0], rowsY[1], v.W + fs * 1.2, num(v.pitch), fs);
    const wall = drawing(-fs * 2.4, -fs * 2.4, v.W + fs * 4.4, v.Hw + fs * 3.2, g, 'Wandansicht: Leistenreihen (dunkel) und Vorschlag zur Modulverteilung');

    // --- Schnitt French Cleat ---
    const k = 1, X0 = 40;
    let gs = S.rect(0, -40, X0 - 2, ch * 2 + 120, 'class="wall"');
    gs += S.text(4, -28, 'Wand', 'font-size="9" class="lbl"');
    // Wandleiste: Spitze vorne oben (x=t, y=0), an der Wand niedriger (y=t)
    const wy = 60;
    gs += S.poly([[X0, wy + t], [X0 + t, wy], [X0 + t, wy + ch], [X0, wy + ch]], 'class="wood2"');
    // Modulleiste: liegt auf der Schräge, Spitze hinten unten
    gs += S.poly([[X0, wy + t - 0.5], [X0, wy + t - ch - 0.5], [X0 + t, wy + t - ch - 0.5], [X0 + t, wy - 0.5]], 'class="wood"');
    // Modulrückwand
    const mbH = ch + 110;
    gs += S.rect(X0 + t, wy + t - ch - 0.5, t, mbH, 'class="wood"');
    gs += S.rect(X0, wy + t - ch - 0.5 + mbH - 30, t, 30, 'class="wood"');
    const lx = X0 + 2 * t + 8;
    gs += S.text(lx, wy - ch * 0.5, '← Modulleiste (Spitze unten, zur Wand)', 'font-size="7" class="lbl"');
    gs += S.text(lx, wy + ch * 0.55, '← Wandleiste (Spitze oben, vorne)', 'font-size="7" class="lbl"');
    gs += S.text(lx, wy + ch + 18, '← Modul-Rückwand', 'font-size="7" class="lbl"');
    gs += S.text(lx, wy + t - ch + mbH - 12, '← Abstandsleiste', 'font-size="7" class="lbl"');
    const section = drawing(0, -50, 200 * k, mbH + 70, gs, `Schnitt: ${ch} mm hohe Leisten, 45° gerissen. Das Gewicht drückt das Modul zur Wand.`);
    plan.drawings = [wall, section];
    plan.parts = parts;
    plan.cutplan = `<p>Bretter ${t} × mind. ${mm(ripW)} × ${v.stock} mm mittig mit 45° längs auftrennen (Tischkreissäge oder Handkreissäge mit Führungsschiene, Sägeblatt auf 45°). Jedes Brett ergibt <b>zwei</b> Leisten mit ${mm(ch)} langer Seite.</p>` +
      stripPlanSvg(bins, v.stock, ch, 2, `Ablängplan der ${bins.length} Leisten (2 je Brett)`);
    plan.jigs = [
      ['Abstandslehre', mm(lehre), 'Unterkante Leiste → Oberkante nächste Leiste. Auf die montierte Leiste stellen, nächste Leiste aufsetzen, verschrauben.'],
      ['Wasserwaage / Laser', '–', 'nur die oberste Leiste ausrichten, Rest über die Lehre'],
      ...Object.values(tplMap).filter(x => !x.holes).map(x => [`Konsolen-Schablone ${num(x.a)} × ${num(x.b)}`, '1:1 Papier', 'aufkleben, mit Stichsäge aussägen; erste Konsole dient als Schablone für die übrigen']),
    ];
    const wallPts = nRows * (Math.ceil(v.W / 400) + 1);
    plan.buy = [
      [`Brett ${t} mm, mind. ${num(ripW)} mm breit`, `${boards} × ${v.stock} mm`, 'Multiplex oder gerade Fichte/Kiefer, astarm'],
      [`Platte ${t} mm für Module`, `ca. ${(plateArea * 1.25).toFixed(2).replace('.', ',')} m²`, 'inkl. 25 % Verschnitt'],
      ...(v.board === 'ply' ? [['Sperrholz/OSB 12 mm', '1 Stk', `${num(v.W)} × ${num(v.Hw)} mm`], ['Spax 3,5 × 25', `${nRows * Math.ceil(v.W / 200)} Stk`, 'Leisten auf Trägerplatte (von hinten oder mit Leim)']] : []),
      [v.board === 'ply' ? 'Dübel 8 mm + Schraube 6 × 60 (Trägerplatte)' : 'Dübel 8 mm + Schraube 5 × 70 (Wandleisten)', `${v.board === 'ply' ? Math.ceil(v.W / 400 + 1) * Math.ceil(v.Hw / 400 + 1) : wallPts} Stk`, 'max. 40 cm Abstand; bei Ständerwand in die Ständer'],
      ['Spax 4 × 40', `ca. ${Math.ceil(modScrews * 1.15)} Stk`, 'für die Module'],
      ...(hooks ? [['Schraubhaken / Garderobenhaken', `${hooks} Stk`, 'für Hakenleisten']] : []),
      ['Holzleim (D3)', '1 Flasche', 'Modulleisten immer leimen + schrauben'],
    ];
    plan.steps = [
      `<b>Leisten reißen:</b> Sägeblatt auf 45° stellen, Bretter (mind. ${mm(ripW)} breit) mittig längs auftrennen. Ergibt pro Brett zwei Leisten mit ${mm(ch)} Höhe. Schnittkanten leicht brechen.`,
      `<b>Ablängen:</b> ${nRows * pieces} Wandleisten à ${mm(pieceLen)}${pieces > 1 ? ' (Stoß versetzt auf einen Dübelpunkt legen)' : ''} und die Modulleisten in Modulbreite.`,
      `<b>Erste Leiste:</b> Oberste Wandleiste ${mm(top0)} unter Oberkante der Fläche mit der Wasserwaage ausrichten. <b>Schräge nach oben, zur Wand zeigend</b> – die Spitze ist vorne oben. Dübel max. 40 cm Abstand.`,
      `<b>Weitere Leisten:</b> Abstandslehre (${mm(lehre)}) links und rechts auf die montierte Leiste stellen, nächste Leiste aufsetzen, festschrauben. So entsteht das ${mm(v.pitch)}-Raster ohne Messen.`,
      `<b>Module bauen:</b> Rückwand zuschneiden, Modulleiste oben bündig auf die Rückseite leimen und schrauben – <b>Schräge nach unten, Spitze zur Wand</b>. Unten die Abstandsleiste (${mm(t)} stark) aufleimen, damit das Modul senkrecht hängt.`,
      `<b>Ablagen &amp; Werkzeughalter:</b> Konsolen-Schablone aufkleben, Dreiecke aussägen, Boden bzw. Lochbrett auf die Rückwand-Oberkante schrauben, Konsolen darunter. Lochbrett vorher mit der Bohrschablone bohren (Forstnerbohrer, Opferbrett unterlegen).`,
      `<b>Fächer:</b> Seiten, Boden und Front als offenen Kasten verleimen und von hinten durch die Rückwand verschrauben.`,
      `<b>Einhängen:</b> Modul von oben schräg in die Wandleiste einhängen und nach unten absenken. Module lassen sich jederzeit umhängen.`,
    ];

    // Schablonen
    const tpls = [];
    Object.values(tplMap).forEach(x => {
      if (x.holes) {
        const pad = 10;
        const off = (x.w - (x.n - 1) * v.holeSp) / 2;
        const cy = pad + t + (x.d - t) / 2;
        let b = S.rect(0, pad, x.w, x.d, 'fill="none" stroke="#000" stroke-width="0.3"');
        b += S.line(0, pad + t, x.w, pad + t, 'stroke="#888" stroke-width="0.2" stroke-dasharray="2 1"');
        b += S.text(2, pad - 3, `Lochbrett ${x.w} × ${x.d}: ${x.n} Löcher Ø ${v.holeD}, Abstand ${v.holeSp} – Rückseite oben, gestrichelt = Rückwand`, 'font-size="3"');
        for (let i = 0; i < x.n; i++) { const hx = off + i * v.holeSp; b += holeMark(hx, cy, v.holeD); b += S.text(hx, cy + v.holeD / 2 + 5, num(hx), 'font-size="2.8" text-anchor="middle"'); }
        tpls.push({ title: `Bohrschablone Lochbrett ${x.w}`, w: x.w + 2, h: x.d + pad + 4, body: b });
      } else {
        const p0 = 8;
        let b = S.poly([[p0, p0], [p0 + x.a, p0], [p0, p0 + x.b]], 'fill="#f6ecd9" stroke="#000" stroke-width="0.35"');
        b += S.text(p0 + 4, p0 + 6, `Konsole ${num(x.a)} × ${num(x.b)}`, 'font-size="3.5"');
        b += S.text(p0 + 4, p0 + 11, 'oben = an den Boden', 'font-size="2.8"');
        b += S.text(p0 + 4, p0 + 15, 'links = an die Rückwand', 'font-size="2.8"');
        b += holeMark(p0 + t / 2 + 4, p0 + x.b * 0.35, 4) + holeMark(p0 + t / 2 + 4, p0 + x.b * 0.7, 4);
        tpls.push({ title: `Konsolen-Schablone ${num(x.a)} × ${num(x.b)}`, w: x.a + 2 * p0, h: x.b + 2 * p0, body: b, hint: 'Schraublöcher = Vorbohrung für Schrauben von hinten durch die Rückwand' });
      }
    });
    // Abstandslehre zur Kontrolle 1:1
    let lb = S.rect(10, 10, 60, lehre, 'fill="#f6ecd9" stroke="#000" stroke-width="0.35"');
    lb += S.text(14, 18, `Abstandslehre`, 'font-size="3.5"');
    lb += S.text(14, 23, `${num(lehre)} mm hoch`, 'font-size="3.5"');
    tpls.push({ title: 'Abstandslehre (Kontrollmaß)', w: 80, h: lehre + 20, body: lb, hint: 'Holzklotz auf dieses Maß ablängen' });
    plan.templates = tpls;
    return plan;
  },
};
